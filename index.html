<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аналитика продавца — ВсеИнструменты.ру · ГТВ РУС</title>
<style>
/* ============================================================
   ДИЗАЙН-ТОКЕНЫ. Тёмная тема, фирменная пара «графит + оранжевый».
   ============================================================ */
:root{
  --bg:#101216; --bg2:#161920; --panel:#1a1e26; --panel2:#20252f;
  --line:#2a3038; --line2:#363d48;
  --tx:#e8ecf2; --tx2:#98a2b3; --tx3:#6b7484;
  --acc:#ff7a18; --acc2:#ffa04d; --accdim:rgba(255,122,24,.14);
  --ok:#3ecf8e; --warn:#ffb020; --bad:#ff5f56; --info:#5aa9ff;
  --okdim:rgba(62,207,142,.14); --warndim:rgba(255,176,32,.14); --baddim:rgba(255,95,86,.14);
  --r:10px; --r2:14px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--acc2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--ok)} .neg{color:var(--bad)} .mut{color:var(--tx2)} .mut3{color:var(--tx3)}
.small{font-size:12px} .xs{font-size:11px}
.hidden{display:none!important}

/* ---------- Шапка ---------- */
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#12151b 0%,#12151bf2 100%);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--acc);display:grid;place-items:center;
  color:#12151b;font-weight:800;font-size:13px}
.brand small{display:block;font-weight:500;color:var(--tx3);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 13px;cursor:pointer;
  transition:.13s;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#12151b;font-weight:650}
.btn.primary:hover{background:var(--acc2);border-color:var(--acc2);color:#12151b}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
select.sel{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;cursor:pointer}
input.inp{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;width:100%}
input.inp:focus{outline:none;border-color:var(--acc)}
input[type=number]{font-family:var(--mono)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;background:var(--line);
  border-top:1px solid var(--line)}
.kpi{background:var(--bg2);padding:11px 16px 12px;min-width:0}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:3px}
.kpi .val{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:11.5px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10.5px;font-weight:600;vertical-align:1px}
.tag.ok{background:var(--okdim);color:var(--ok)} .tag.bad{background:var(--baddim);color:var(--bad)}
.tag.warn{background:var(--warndim);color:var(--warn)} .tag.acc{background:var(--accdim);color:var(--acc2)}
.tag.n{background:var(--panel2);color:var(--tx2)}

/* ---------- Вкладки ---------- */
nav.tabs{display:flex;gap:2px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:11px 14px;cursor:pointer;
  color:var(--tx2);font-weight:550;white-space:nowrap}
nav.tabs button:hover{color:var(--tx)}
nav.tabs button.on{color:var(--acc2);border-bottom-color:var(--acc)}
nav.tabs .cnt{background:var(--panel2);border-radius:20px;padding:0 6px;font-size:10.5px;margin-left:6px;color:var(--tx2)}

main{padding:18px 20px 60px;max-width:1580px;margin:0 auto}
section.tab{display:none} section.tab.on{display:block}

/* ---------- Карточки ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;margin-bottom:14px}
.card>h3{margin:0 0 3px;font-size:14.5px;letter-spacing:-.01em}
.card>h3+.hint{margin:0 0 13px}
.hint{color:var(--tx3);font-size:12px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1050px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- Инсайты ---------- */
.ins{display:flex;gap:11px;padding:11px 13px;border-radius:var(--r);background:var(--bg2);
  border-left:3px solid var(--line2);margin-bottom:8px}
.ins .ic{font-size:15px;line-height:1.2;width:18px;flex:none;text-align:center}
.ins.bad{border-left-color:var(--bad)} .ins.ok{border-left-color:var(--ok)}
.ins.warn{border-left-color:var(--warn)} .ins.info{border-left-color:var(--info)}
.ins b{font-family:var(--mono);font-weight:600}

/* ---------- Таблицы ---------- */
.tw{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th{position:sticky;top:0;z-index:2;background:var(--panel2);text-align:right;padding:8px 9px;white-space:nowrap;
  font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--tx2);
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
th.nos{cursor:default}
th:hover:not(.nos){color:var(--acc2)}
th .ar{color:var(--acc);margin-left:3px}
td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover td{background:var(--bg2)}
tr.grp td{background:var(--panel2);font-weight:600}
tr.exp td{background:var(--bg2)}
td.nm{max-width:400px;white-space:normal;line-height:1.35}
td.clk{cursor:pointer}
td.clk:hover{color:var(--acc2)}
.art{font-family:var(--mono);font-size:11.5px;color:var(--acc2)}
tfoot td{position:sticky;bottom:0;background:var(--panel2);font-weight:650;border-top:1px solid var(--line2)}

/* ---------- Полосы прогресса ---------- */
.bar{height:9px;background:var(--bg);border-radius:5px;overflow:hidden;position:relative;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx);border-radius:2px}
.pf{margin-bottom:16px}
.pf .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:10px}
.pf .top b{font-size:13px} .pf .top span{font-family:var(--mono);font-size:12.5px}

/* ---------- Прочее ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:11.5px;cursor:pointer}
.chip.on{background:var(--accdim);border-color:var(--acc);color:var(--acc2)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.tools input.inp{width:auto;min-width:210px}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r2);padding:26px;text-align:center;color:var(--tx2);
  cursor:pointer;transition:.15s;background:var(--bg2)}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--acc2);background:var(--accdim)}
.files{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;gap:10px;padding:8px 11px;background:var(--bg2);border-radius:var(--r);
  border:1px solid var(--line);font-size:12.5px}
.frow .x{cursor:pointer;color:var(--tx3);padding:0 4px}
.frow .x:hover{color:var(--bad)}
.ci{display:flex;gap:8px;align-items:center;margin-bottom:9px;cursor:pointer}
.ci input{accent-color:var(--acc);width:15px;height:15px;cursor:pointer}
.costin{width:96px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:3px 6px;
  text-align:right;font-family:var(--mono);font-size:12px}
.costin:focus{outline:none;border-color:var(--acc)}
.costin.man{border-color:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}

/* ---------- Модалка / тосты ---------- */
.ovl{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);z-index:90;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);padding:22px;max-width:600px;width:100%;
  max-height:85vh;overflow:auto}
.modal h3{margin:0 0 8px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:430px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--info);border-radius:var(--r);
  padding:11px 14px;font-size:12.5px;box-shadow:0 8px 26px #0007;animation:sl .22s ease}
.toast.err{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)}
@keyframes sl{from{opacity:0;transform:translateX(18px)}}
.empty{padding:34px 20px;text-align:center;color:var(--tx3);background:var(--bg2);border-radius:var(--r);
  border:1px dashed var(--line2)}
svg text{font-family:var(--mono);font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand"><span class="mark">ГТ</span>
      <span>Аналитика продаж<small>ВсеИнструменты.ру · ГТВ РУС</small></span></div>
    <div class="spacer"></div>
    <select class="sel" id="periodSel" title="Период отображения"></select>
    <button class="btn" id="btnSnap" title="Зафиксировать текущие показатели периода в истории">Сохранить срез</button>
    <button class="btn" id="btnState" title="Перенести данные в другой браузер или на другой компьютер">Состояние</button>
    <button class="btn" id="btnClear" title="Удалить загруженные данные">Очистить</button>
    <input type="file" id="stateIn" accept=".json" style="display:none">
    <button class="btn primary" id="btnUp">Загрузить отчёты</button>
    <input type="file" id="fileIn" multiple accept=".xlsx,.xls,.xlsm" style="display:none">
  </div>
  <div class="kpis" id="kpis"></div>
</header>

<nav class="tabs" id="tabs">
  <button data-t="ov" class="on">Обзор</button>
  <button data-t="pf">План-факт</button>
  <button data-t="ue">Юнит-экономика</button>
  <button data-t="pr">Товары</button>
  <button data-t="ad">Реклама / Воронка</button>
  <button data-t="st">Остатки</button>
  <button data-t="mx">Матрица ВИ</button>
  <button data-t="dt">Данные и настройки</button>
</nav>

<div id="storageWarn"></div>

<main>
  <section class="tab on" id="tab-ov"></section>
  <section class="tab" id="tab-pf"></section>
  <section class="tab" id="tab-ue"></section>
  <section class="tab" id="tab-pr"></section>
  <section class="tab" id="tab-ad"></section>
  <section class="tab" id="tab-st"></section>
  <section class="tab" id="tab-mx"></section>
  <section class="tab" id="tab-dt"></section>
</main>

<div class="toasts" id="toasts"></div>
<div id="modalHost"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ================================================================================
   БЛОК 1. УТИЛИТЫ, СОСТОЯНИЕ, СОХРАНЕНИЕ
   ================================================================================ */
"use strict";

const LS = {
  data:"vidash_v1_data", cost:"vidash_v1_cost", plan:"vidash_v1_plan",
  cfg:"vidash_v1_cfg", snap:"vidash_v1_snap", ui:"vidash_v1_ui"
};

/* Настройки по умолчанию. Пороги остатков и правила учёта — редактируются на вкладке «Данные». */
const DEF_CFG = {
  critDays:7, warnDays:14, vatCost:true, vat:1.22,
  skipMktBonus:true,          // маркетинговый бонус 8% не вычитаем вторым разом: он и есть источник маркетингового плана
  rrcK:null,                  // коэффициент РРЦ / закупочная цена; null = считать из PRICAT автоматически
  adBase:"rev",               // база разнесения рекламы на товары: rev — по выручке, qty — по штукам
  matrixActive:null,          // id набора матрицы, который используется как актуальный
  taxRate:0,                  // ставка налога на прибыль, % (0 = не учитывать)
  drrLo:7, drrHi:15,          // ориентир ДРР из брифа
  costSrcPrio:["report","costfile","pricat","manual"]
};

const S = {
  periods:{},      // ключ "2026-01" -> {key,label,from,to,files:[],items:{art:{...}}}
  files:[],        // {id,name,type,period,rows,ts}
  costFile:{},     // art -> {v, name, unit}   («Себестоимость.xlsx», с НДС)
  pricat:{},       // art -> {name,brand,stock,viPrice,retail,barcode}
                   // viPrice = «Закупочная цена» из PRICAT: это НАША расчётная цена продажи для ВИ,
                   // а не себестоимость. В расчёте себестоимости не участвует ни при каких условиях.
  matrix:{},       // art -> {cls,name} — активный набор матрицы
  matrixSets:{},   // id -> {id,label,quarter,map,source} — наборы матрицы по кварталам
  planFile:null,   // годовой план: {year, rev[12], marg[12]}
  mkt:null,        // маркетинговый план
  bonus:{},        // "2026-Q1" -> {rows:[],total,year,q}
  viSell:null,     // sell-out ВИ конечным покупателям
  viStock:[],      // остатки на складах ВИ
  manualCost:{},   // art -> число, введено вручную
  plan:{},         // "2026-01" -> {rev,profit,cats:{}}
  snaps:[],
  cfg:{...DEF_CFG},
  cur:null,        // текущий ключ периода ("ALL" = все)
  ui:{tab:"ov"}
};

/* ---------- Числа и форматирование ---------- */
const MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONTHS_C=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

function n(v){ // безопасный разбор числа из ячейки Excel (в т.ч. "1 234,56")
  if(v===null||v===undefined||v==="")return null;
  if(typeof v==="number")return isFinite(v)?v:null;
  const s=String(v).replace(/\u00a0|\s/g,"").replace(",",".").replace(/[^\d.\-]/g,"");
  const x=parseFloat(s); return isFinite(x)?x:null;
}
const num=v=>{const x=n(v);return x===null?0:x;};
function f0(v){return v==null||!isFinite(v)?"—":Math.round(v).toLocaleString("ru-RU");}
function f2(v){return v==null||!isFinite(v)?"—":v.toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});}
function money(v){return v==null||!isFinite(v)?"—":Math.round(v).toLocaleString("ru-RU")+" ₽";}
function short(v){
  if(v==null||!isFinite(v))return "—";
  const a=Math.abs(v),s=v<0?"−":"";
  if(a>=1e9)return s+(a/1e9).toFixed(2)+" млрд";
  if(a>=1e6)return s+(a/1e6).toFixed(2)+" млн";
  if(a>=1e3)return s+(a/1e3).toFixed(0)+" тыс";
  return s+Math.round(a);
}
function pct(v,d){return v==null||!isFinite(v)?"—":(v*100).toFixed(d==null?1:d).replace(".",",")+"%";}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean=s=>String(s==null?"":s).replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
const cls=v=>v>0?"pos":v<0?"neg":"";

/* ---------- Артикулы ---------- */
/* В выгрузке 1С артикул спрятан в хвосте наименования: обычно последний сегмент после запятой
   («… 520х390х1003 мм, HT7G500-S1»), но в PRICAT он идёт без запятой («… 160 мм HT1P006»). */
const RX_ART=/^[A-ZА-Я0-9]{2,4}[-]?[0-9A-ZА-Я][A-ZА-Я0-9\-\/\.]{1,}$/i;
/* Типы документов 1С. \b тут не годится: \w в JS не включает кириллицу, границы слова не будет. */
const RX_DOC=/^(Заказ клиента|Реализация|Возврат[а-яё]*|Отч[её]т[а-яё]*|Сч[её]т[а-яё]*|Акт|Перемещение)/i;
/* Уровни группировки отчёта (менеджер, партнёр, контрагент) тоже приходят с заполненным количеством —
   на каждом уровне повторяется сумма нижележащих строк. Их нельзя считать товарами: иначе одна продажа
   учитывается четыре раза. Отличаем по виду подписи, потому что уровень вложенности в xlsx закодирован
   только отступом ячейки, который SheetJS не отдаёт. */
const RX_MANAGER=/^[А-ЯЁ][а-яё]+(-[А-ЯЁ][а-яё]+)?\s+[А-ЯЁ]\.$/;      // «Соколова О.»
const RX_ORG=/(^|\s)(ООО|ЗАО|ПАО|АО|ИП)(\s|$)/i;                     // «ВСЕИНСТРУМЕНТЫ.РУ ООО»
const RX_SITE=/^[\wА-Яа-яЁё\-\s]+\.(ру|рф|ru)$/i;                    // «ВсеИнструменты.ру»
const isGroupRow=s=>RX_DOC.test(s)||RX_MANAGER.test(s)||RX_ORG.test(s)||RX_SITE.test(s);
function extractArt(name){
  const s=clean(name); if(!s)return null;
  const parts=s.split(",");
  const last=clean(parts[parts.length-1]);
  if(last&&last.length<=24&&RX_ART.test(last)&&/\d/.test(last))return last.toUpperCase();
  const m=s.match(/([A-Z]{2,3}[0-9][A-Z0-9]{2,}(?:-[A-Z0-9]{1,4})*)\s*$/i);
  if(m)return m[1].toUpperCase();
  return null;
}
function stripArt(name,art){
  let s=clean(name);
  if(art){const i=s.toUpperCase().lastIndexOf(art);if(i>0)s=clean(s.slice(0,i).replace(/[,\s]+$/,""));}
  return s;
}

/* Категорий в выгрузках нет ни в одной. Выводим из префикса артикула — в интерфейсе помечено как расчётный признак. */
const CATMAP={
  HT5K:"СИЗ и спецодежда", HT1S:"Биты и насадки", HT6D:"Оснастка: диски и свёрла",
  HT7D:"Оснастка: свёрла и коронки", HT8D:"Абразивы и шлифование", HT3B:"Ударный инструмент",
  HT1P:"Шарнирно-губцевый инструмент", HT8G:"Автоинструмент", HT4R:"Головки и монтажный инструмент",
  HT1A:"Торцевые головки", HT1W:"Ключи гаечные", HT1R:"Ключи трещоточные",
  HT7G:"Ящики, кейсы, тележки", HT2C:"Степлеры и крепёж", HT4M:"Измерительный инструмент",
  HT1E:"Электрика и освещение", HT4C:"Ножи и лезвия", HT3S:"Пилы и полотна",
  HT2E:"Электроинструмент", HT2A:"Насадки для реноваторов", HT1F:"Отвёртки",
  PB:"GTV: ящики и системы", PD:"GTV: газлифты и механизмы", LD:"GTV: освещение",
  WG:"GTV: гардеробные системы", KK:"GTV: вентиляция", NM:"GTV: опоры и ножки",
  WW:"GTV: вешалки", PM:"GTV: кабель-менеджмент", AE:"GTV: розетки и удлинители",
  PG:"GTV: пантографы"
};
function catOf(art){
  if(!art)return "Без артикула";
  const a=art.toUpperCase();
  if(CATMAP[a.slice(0,4)])return CATMAP[a.slice(0,4)];
  if(CATMAP[a.slice(0,2)])return CATMAP[a.slice(0,2)];
  if(a.startsWith("HT"))return "Прочий инструмент HOEGERT";
  return "Прочее";
}

/* ---------- Работа с localStorage ----------
   Прямая запись JSON.stringify(состояние) занимала около 4,4 МБ и упиралась в лимит браузера
   (обычно 5 МБ на домен), из-за чего сохранение падало целиком и при следующем открытии
   дашборд оказывался пустым. Поэтому состояние пакуется: все строки (артикулы, наименования,
   бренды) выносятся в общий словарь и заменяются числовыми индексами, а строки товаров
   хранятся массивами без имён полей. Это уменьшает объём примерно втрое. */
const LS_VER=2;

function packState(){
  const dict=[],idx=new Map();
  const S_=v=>{                      // строка -> индекс в словаре
    if(v==null||v==="")return -1;
    const s=String(v);let i=idx.get(s);
    if(i===undefined){i=dict.length;dict.push(s);idx.set(s,i);}
    return i;};
  const r2=v=>v==null?null:Math.round(v*100)/100;
  const periods={};
  Object.entries(S.periods).forEach(([k,p])=>{
    periods[k]={l:p.label,f:p.from,t:p.to,d:p.days,dc:p.docs||{},
      src:(p.sources||[]).map(S_),sk:p.skippedDocRows||0,skr:r2(p.skippedDocRev),
      rt:p.reportTotal||null,
      ret:p.ret?{...p.ret,list:(p.ret.list||[]).map(x=>[S_(x.doc),x.qty,r2(x.rev),r2(x.gross)])}:null,
      it:(p.items||[]).map(t=>[S_(t.art),S_(t.name),t.qty,r2(t.rev),r2(t.cost),r2(t.pur),
        r2(t.gross),t.retQty||0,r2(t.retRev)||0,t.lines||0])};
  });
  return {v:LS_VER,dict,periods,
    pricat:Object.entries(S.pricat).map(([a,p])=>[S_(a),S_(p.name),S_(p.brand),p.stock,p.viPrice,p.retail,S_(p.barcode)]),
    costFile:Object.entries(S.costFile).map(([a,c])=>[S_(a),c.v,S_(c.name),S_(c.unit),c.vat?1:0]),
    matrixSets:Object.values(S.matrixSets||{}).map(st=>({id:st.id,label:st.label,quarter:st.quarter,
      count:st.count,rows:Object.entries(st.map).map(([a,m])=>[S_(a),S_(m.cls),S_(m.name)])})),
    viStock:(S.viStock||[]).map(x=>[S_(x.name),S_(x.art),x.qty,r2(x.amount)]),
    viSell:S.viSell,mkt:S.mkt,bonus:S.bonus,planFile:S.planFile};
}
function unpackState(d){
  if(!d)return;
  if(d.v!==LS_VER){                  // старый формат — читаем как есть, чтобы ничего не потерять
    Object.assign(S,{periods:d.periods||{},costFile:d.costFile||{},pricat:d.pricat||{},
      matrix:d.matrix||{},matrixSets:d.matrixSets||{},planFile:d.planFile||null,
      mkt:d.mkt||null,bonus:d.bonus||{},viSell:d.viSell||null,viStock:d.viStock||[]});
    return;
  }
  const D=d.dict||[];const G=i=>(i==null||i<0)?"":D[i];
  const periods={};
  Object.entries(d.periods||{}).forEach(([k,p])=>{
    periods[k]={key:k,label:p.l,from:p.f,to:p.t,days:p.d,docs:p.dc||{},
      sources:(p.src||[]).map(G),skippedDocRows:p.sk,skippedDocRev:p.skr,reportTotal:p.rt,
      ret:p.ret?{...p.ret,list:(p.ret.list||[]).map(x=>({doc:G(x[0]),qty:x[1],rev:x[2],gross:x[3]}))}:null,
      items:(p.it||[]).map(t=>({art:G(t[0]),name:G(t[1]),qty:t[2],rev:t[3],cost:t[4],pur:t[5],
        gross:t[6],retQty:t[7],retRev:t[8],lines:t[9]}))};
  });
  S.periods=periods;
  S.pricat={};(d.pricat||[]).forEach(r=>S.pricat[G(r[0])]={name:G(r[1]),brand:G(r[2]),
    stock:r[3],viPrice:r[4],retail:r[5],barcode:G(r[6])});
  S.costFile={};(d.costFile||[]).forEach(r=>S.costFile[G(r[0])]={v:r[1],name:G(r[2]),unit:G(r[3]),vat:!!r[4]});
  S.matrixSets={};(d.matrixSets||[]).forEach(st=>{
    const map={};(st.rows||[]).forEach(r=>map[G(r[0])]={cls:G(r[1])||null,name:G(r[2])});
    S.matrixSets[st.id]={id:st.id,label:st.label,quarter:st.quarter,count:st.count,map};});
  S.viStock=(d.viStock||[]).map(r=>({name:G(r[0]),art:G(r[1]),qty:r[2],amount:r[3]}));
  S.viSell=d.viSell||null;S.mkt=d.mkt||null;S.bonus=d.bonus||{};S.planFile=d.planFile||null;
}

/* Проверяем, разрешено ли браузеру хранить данные. Например, Safari полностью запрещает
   localStorage для файлов, открытых как file://, а режим инкогнито может его блокировать.
   Без этой проверки дашборд молча терял бы всё при закрытии вкладки. */

try{localStorage.setItem("vidash_probe","1");localStorage.removeItem("vidash_probe");}
catch(e){STORAGE_OK=false;STORAGE_ERR=e.name||e.message;}

      ".<br><span class='xs mut'>Срезы, планы и настройки сохранены. Удалите лишние периоды кнопкой «Очистить» "+
      "или выгрузите состояние в файл, чтобы перенести его.</span>","err",14000);

}
function load(){
  try{
    S.manualCost=JSON.parse(localStorage.getItem(LS.cost)||"{}");
    S.plan=JSON.parse(localStorage.getItem(LS.plan)||"{}");
    S.cfg={...DEF_CFG,...JSON.parse(localStorage.getItem(LS.cfg)||"{}")};
    S.snaps=JSON.parse(localStorage.getItem(LS.snap)||"[]");
    const u=JSON.parse(localStorage.getItem(LS.ui)||"{}"); S.ui.tab=u.tab||"ov"; S.cur=u.cur||null;
    unpackState(JSON.parse(localStorage.getItem(LS.data)||"null"));
  }catch(e){console.warn("Восстановление состояния:",e);}
}

/* Перенос состояния между браузерами и компьютерами. localStorage привязан к конкретному
   браузеру на конкретной машине, поэтому единственный способ увидеть те же данные в другом
   браузере — выгрузить файл состояния и загрузить его там. */
function exportState(){
  const blob=new Blob([JSON.stringify({
    kind:"vidash-state",saved:new Date().toISOString(),
    data:packState(),manualCost:S.manualCost,plan:S.plan,cfg:S.cfg,snaps:S.snaps,cur:S.cur
  })],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="состояние-дашборда-"+new Date().toISOString().slice(0,10)+".json";
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("Состояние выгружено. Загрузите этот файл в другом браузере кнопкой «Состояние → Загрузить из файла».","ok",8000);
}
async function importState(file){
  try{
    const j=JSON.parse(await file.text());
    if(j.kind!=="vidash-state")throw new Error("это не файл состояния дашборда");
    unpackState(j.data);
    S.manualCost=j.manualCost||{};S.plan=j.plan||{};
    S.cfg={...DEF_CFG,...(j.cfg||{})};S.snaps=j.snaps||[];S.cur=j.cur||null;
    pickActiveMatrix();
    finishLoad();
    toast("Состояние загружено: периодов <b>"+Object.keys(S.periods).length+"</b>, срезов <b>"+S.snaps.length+"</b>","ok");
  }catch(e){toast("Не удалось прочитать файл состояния: "+esc(e.message),"err",9000);}
}

/* ================================================================================
   БЛОК 2. ПАРСЕРЫ. Тип файла определяется по набору колонок и названиям листов,
   имя файла не используется вообще. Каждый парсер при отсутствии обязательной
   колонки бросает ParseError с указанием, чего именно не хватает.
   ================================================================================ */
class ParseError extends Error{constructor(m){super(m);this.name="ParseError";}}

const A=(sh)=>XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null,blankrows:true});
const cellsOf=(rows,maxR)=>{const o=[];for(let i=0;i<Math.min(rows.length,maxR||40);i++)
  for(const c of (rows[i]||[]))if(typeof c==="string")o.push(clean(c).toLowerCase());return o;};
const findRow=(rows,pred,lim)=>{for(let i=0;i<Math.min(rows.length,lim||120);i++)if(pred(rows[i]||[],i))return i;return -1;};
const colIdx=(row,...names)=>{ // ищем колонку по вхождению подстроки, регистронезависимо
  for(let i=0;i<row.length;i++){const v=clean(row[i]).toLowerCase();
    if(v&&names.some(nm=>v===nm||v.includes(nm)))return i;}
  return -1;};

/* --- 2.1 Определение типа файла --- */
function detectType(wb){
  const names=wb.SheetNames.map(s=>clean(s).toLowerCase());
  for(const sn of wb.SheetNames){
    const rows=A(wb.Sheets[sn]); const t=cellsOf(rows,45).join("|");
    if(t.includes("валовая прибыль")&&t.includes("себестоимость товаров"))return {type:"sales1c",sheet:sn};
    if(t.includes("артикул товара поставщика")&&t.includes("количество остатков"))return {type:"pricat",sheet:sn};
    if(clean(sn).toLowerCase()==="мп"&&t.includes("активность/период"))return {type:"mktplan",sheet:sn};
    if(t.includes("бонус в руб")||/итог\s+\d-й\s+квартал/.test(t))return {type:"bonus",sheet:sn};
    if(/план\s+оборот/.test(t))return {type:"planfile",sheet:sn};
  }
  if(names.some(x=>x.includes("продажи по ск"))||names.includes("марица товаров")||names.includes("матрица товаров"))
    return {type:"viwb",sheet:null};
  for(const sn of wb.SheetNames){
    const rows=A(wb.Sheets[sn]); const t=cellsOf(rows,10).join("|");
    if(t.includes("артикул")&&t.includes("себестоимость"))return {type:"costfile",sheet:sn};
  }
  return {type:null,sheet:null};
}

/* --- 2.2 Отчёт 1С «Валовая прибыль по клиентам» (продажи ГТВ РУС → ВсеИнструменты.ру) ---
   Иерархия: менеджер → партнёр → контрагент → заказ → номенклатура. Уровень вложенности
   в xlsx закодирован отступом, который SheetJS не отдаёт, поэтому строкой товара считаем ту,
   где заполнена числовая «Количество» — у всех группировочных строк она пустая. */
function parseSales1C(wb,sheet){
  const rows=A(wb.Sheets[sheet]);
  let from=null,to=null;
  for(let i=0;i<Math.min(rows.length,25);i++)for(const c of (rows[i]||[])){
    if(typeof c==="string"){
      const m=clean(c).match(/(\d{2}\.\d{2}\.\d{4})\s*[-—–]\s*(\d{2}\.\d{2}\.\d{4})/);
      if(m){from=m[1];to=m[2];}
    }
  }
  if(!from)throw new ParseError("в отчёте 1С не найдена строка «Период: ДД.ММ.ГГГГ - ДД.ММ.ГГГГ»");
  const hr=findRow(rows,r=>colIdx(r,"количество")>=0&&colIdx(r,"выручка")>=0,40);
  if(hr<0)throw new ParseError("в отчёте 1С не найдена строка заголовков с колонками «Количество» и «Выручка»");
  const H=rows[hr],H2=rows[hr+1]||[];
  const cQty=colIdx(H,"количество"), cRev=colIdx(H,"выручка");
  let cCost=colIdx(H,"себестоимость товаров"); if(cCost<0)cCost=colIdx(H,"себестоимость");
  let cPur=colIdx(H2,"стоимость закупки"); if(cPur<0&&cCost>=0)cPur=cCost+1;
  const cGr=colIdx(H,"валовая прибыль");
  if(cRev<0)throw new ParseError("в отчёте 1С не найдена колонка «Выручка»");
  if(cCost<0)throw new ParseError("в отчёте 1С не найдена колонка «Себестоимость товаров»");

  /* Документные строки («Заказ клиента 00УТ-… от …») в этой выгрузке бывают двух видов: без количества
     (обычная группировка) и С количеством — тогда это подытог документа, дублирующий свои же строки
     номенклатуры. Раньше такие строки попадали в расчёт как псевдотовар «NOART:Заказ клиента …»
     и завышали выручку. Теперь они в товары не идут вообще; отрицательные собираются в одну
     справочную строку «Возврат». Строки номенклатуры внутри документов считаются как обычно. */
  const items={},docs={}; let managers={},partner=null,docType=null;
  const ret={qty:0,rev:0,cost:0,pur:0,gross:0,docs:0,list:[]};
  let skippedDocRows=0,skippedDocRev=0;
  let reportTotal=null;   // строка «Итого» самого отчёта 1С — контрольная сумма
  for(let i=hr+2;i<rows.length;i++){
    const r=rows[i]||[]; const a=clean(r[0]); if(!a)continue;
    const q=n(r[cQty]);
    if(q===null){ // группировочная строка
      const md=a.match(RX_DOC);
      if(md){docType=clean(md[1]);docs[docType]=(docs[docType]||0)+1;}
      else if(/ООО|ЗАО|ПАО|ИП /i.test(a))partner=a;
      else if(/^Итого$/i.test(a)){reportTotal={rev:num(r[cRev]),cost:num(r[cCost]),
        gross:cGr>=0?num(r[cGr]):null,qty:null};}
      else if(a.split(" ").length<=3&&/[А-Яа-я]\./.test(a))managers[a]=1;
      continue;
    }
    if(/^Итого$/i.test(a)){reportTotal={rev:num(r[cRev]),cost:num(r[cCost]),
      gross:cGr>=0?num(r[cGr]):null,qty:q};continue;}
    const rev=num(r[cRev]), cost=num(r[cCost]), pur=cPur>=0?num(r[cPur]):0, gr=cGr>=0?num(r[cGr]):rev-cost;

    // подытог любого уровня — в товары не берём
    if(isGroupRow(a)){
      skippedDocRows++; skippedDocRev+=rev;
      // в сводную строку «Возврат» попадают только документы: уровни выше повторили бы ту же сумму
      if(RX_DOC.test(a)&&(rev<0||gr<0)){ret.qty+=q;ret.rev+=rev;ret.cost+=cost;ret.pur+=pur;ret.gross+=gr;
        ret.docs++;ret.list.push({doc:a,qty:q,rev,gross:gr});}
      continue;
    }
    const art=extractArt(a)||("NOART:"+a.slice(0,40));
    const it=items[art]||(items[art]={art,name:stripArt(a,art),qty:0,rev:0,cost:0,pur:0,gross:0,
      retQty:0,retRev:0,lines:0});
    it.qty+=q; it.rev+=rev; it.cost+=cost; it.pur+=pur; it.gross+=gr; it.lines++;
    if(q<0){it.retQty+=-q;it.retRev+=-rev;}
    if(it.name.length<6&&a.length>6)it.name=stripArt(a,art);
  }
  const [d,m,y]=from.split(".");
  return {kind:"sales1c",key:y+"-"+m,label:MONTHS_C[+m-1]+" "+y,from,to,
    items:Object.values(items),docs,ret,skippedDocRows,skippedDocRev,reportTotal,
    managers:Object.keys(managers),days:daysBetween(from,to)};
}
function toDate(s){const[d,m,y]=String(s).split(".");return new Date(+y,+m-1,+d);}
function daysBetween(a,b){return Math.max(1,Math.round((toDate(b)-toDate(a))/86400000)+1);}

/* --- 2.3 Файл себестоимости (собственная управленческая выгрузка) ---
   Заголовок разнесён на две строки: «Артикул | Номенклатура, Серия | Ед. изм. | (Себестоимость с НДС)» */
function parseCostFile(wb,sheet){
  const rows=A(wb.Sheets[sheet]);
  const hr=findRow(rows,r=>colIdx(r,"артикул")>=0,15);
  if(hr<0)throw new ParseError("в файле себестоимости не найдена колонка «Артикул»");
  const H=rows[hr],H2=rows[hr+1]||[];
  const cA=colIdx(H,"артикул"), cN=colIdx(H,"номенклатура","наименование"), cU=colIdx(H,"ед. изм","ед.изм");
  let cC=colIdx(H,"себестоимость","cost"); let withVat=false;
  if(cC<0){cC=colIdx(H2,"себестоимость","cost");}
  if(cC>=0){const lab=clean(H[cC]||H2[cC]||"").toLowerCase();withVat=lab.includes("с ндс");}
  if(cC<0)throw new ParseError("в файле себестоимости не найдена колонка «Себестоимость» (искали «себестоимость», «cost»)");
  const out={};let cnt=0;
  for(let i=hr+1;i<rows.length;i++){
    const r=rows[i]||[];const art=clean(r[cA]);const v=n(r[cC]);
    if(!art||v===null||!RX_ART.test(art))continue;
    out[art.toUpperCase()]={v,name:clean(r[cN]),unit:clean(r[cU])||"шт",vat:withVat};cnt++;
  }
  if(!cnt)throw new ParseError("файл распознан как справочник себестоимости, но не найдено ни одной строки с артикулом и ценой");
  return {kind:"costfile",map:out,count:cnt,withVat};
}

/* --- 2.4 PRICAT: каталог + остатки на складе ГТВ РУС --- */
function parsePricat(wb,sheet){
  const rows=A(wb.Sheets[sheet]);
  const hr=findRow(rows,r=>colIdx(r,"артикул товара поставщика")>=0,15);
  if(hr<0)throw new ParseError("в PRICAT не найдена колонка «Артикул товара поставщика»");
  const H=rows[hr];
  // «Закупочная цена» в PRICAT — это цена, по которой ВсеИнструменты.ру закупает у нас,
  // то есть наша отпускная цена. Читаем её как справочную цену продажи, а не как затраты.
  const cA=colIdx(H,"артикул товара поставщика"), cN=colIdx(H,"наименование"),
        cB=colIdx(H,"бренд"), cS=colIdx(H,"количество остатков"),
        cP=colIdx(H,"закупочная цена"), cR=colIdx(H,"рекомендованная цена"),
        cBar=colIdx(H,"штрихкод");
  if(cS<0)throw new ParseError("в PRICAT не найдена колонка «Количество остатков на складе»");
  const out={};let cnt=0;
  for(let i=hr+1;i<rows.length;i++){
    const r=rows[i]||[];const art=clean(r[cA]);if(!art)continue;
    out[art.toUpperCase()]={name:clean(r[cN]),brand:clean(r[cB]),stock:num(r[cS]),
      viPrice:n(r[cP]),retail:n(r[cR]),barcode:clean(r[cBar])};cnt++;
  }
  return {kind:"pricat",map:out,count:cnt};
}

/* --- 2.5 Маркетинговый план ВИ (лист «МП») ---
   Колонка C = актуальная стоимость с комиссией рекламораспространителя (D + E), далее 12 колонок месяцев
   с количеством размещений. Расход месяца = количество × стоимость × НДС. */
function parseMktPlan(wb,sheet){
  const rows=A(wb.Sheets[sheet]);
  const hr=findRow(rows,r=>colIdx(r,"активность/период")>=0,40);
  if(hr<0)throw new ParseError("в маркетинговом плане не найдена строка заголовков с «Активность/период»");
  const H=rows[hr];
  const cAct=colIdx(H,"активность/период"), cDet=colIdx(H,"детализация");
  let cPrice=-1,year=null;
  for(let i=0;i<H.length;i++){const v=clean(H[i]).toLowerCase();
    if(v.startsWith("актуальная стоимость")){cPrice=i;const m=v.match(/20\d\d/);if(m)year=m[0];break;}}
  if(cPrice<0)throw new ParseError("в маркетинговом плане не найдена колонка «Актуальная стоимость …»");
  const mCols=[];
  for(let i=0;i<H.length;i++){const v=clean(H[i]).toLowerCase();const k=MONTHS.indexOf(v);if(k>=0)mCols.push({m:k,c:i});}
  if(mCols.length<12)throw new ParseError("в маркетинговом плане найдено только "+mCols.length+" месячных колонок из 12");
  if(!year)year=String(new Date().getFullYear());

  // Верхняя часть листа: плановый товарооборот, процент бюджета, бюджет
  const head={};
  for(let i=0;i<hr;i++){const r=rows[i]||[];for(let c=0;c<r.length;c++){
    const v=clean(r[c]).toLowerCase();if(!v)continue;
    const nxt=n(r[c+1])!==null?n(r[c+1]):n(r[c+2]);
    if(v.startsWith("предполагаемый"))head.turnover=nxt;
    if(v.startsWith("фактический"))head.turnoverFact=nxt;
    if(v.startsWith("процент марк"))head.pctBudget=nxt;
    if(v.startsWith("бюджет на марк")&&head.budget==null)head.budget=nxt;
  }}
  const acts=[];let group="Без группы";
  for(let i=hr+1;i<rows.length;i++){
    const r=rows[i]||[];const nameA=clean(r[cAct]);if(!nameA)continue;
    if(/^итого/i.test(nameA))continue;
    const price=n(r[cPrice]);
    const counts=mCols.map(mc=>n(r[mc.c])||0);
    const total=counts.reduce((a,b)=>a+b,0);
    if(price===null&&total===0){ // строка-заголовок раздела (БАННЕРНАЯ РЕКЛАМА и т.п.)
      if(nameA===nameA.toUpperCase()&&nameA.length>4)group=nameA; continue; }
    if(nameA===nameA.toUpperCase()&&price===null){group=nameA;continue;}
    if(total===0)continue;
    acts.push({group,name:nameA,detail:clean(r[cDet]),price:price||0,counts,
      total,spend:counts.map(c=>c*(price||0))});
  }
  const byMonth=Array(12).fill(0);
  acts.forEach(a=>a.spend.forEach((v,i)=>byMonth[i]+=v));
  return {kind:"mktplan",year,acts,byMonth,head};
}

/* --- 2.5b Годовой план: оборот и маржа по месяцам ---
   Строки «План оборот ГГГГ» и «План маржа ГГГГ», колонки — месяцы, последняя колонка «год».
   Маржа здесь — валовая (оборот минус себестоимость), без вычета рекламы и бонусов. */
function parsePlanFile(wb,sheet){
  const rows=A(wb.Sheets[sheet]);
  const hr=findRow(rows,r=>r.some(c=>typeof c==="string"&&MONTHS.includes(clean(c).toLowerCase())),20);
  if(hr<0)throw new ParseError("в файле плана не найдена строка с названиями месяцев");
  const mCols=[];
  rows[hr].forEach((c,i)=>{const k=MONTHS.indexOf(clean(c).toLowerCase());if(k>=0)mCols.push({m:k,c:i});});
  if(mCols.length<12)throw new ParseError("в файле плана найдено "+mCols.length+" месячных колонок из 12");
  let year=null,rev=null,marg=null;
  for(let i=hr;i<rows.length;i++){
    const r=rows[i]||[];const lab=clean(r[0]).toLowerCase();
    if(!lab)continue;
    const ys=lab.match(/20\d\d/);if(ys&&!year)year=ys[0];
    const vals=Array(12).fill(null);mCols.forEach(mc=>vals[mc.m]=n(r[mc.c]));
    if(lab.includes("оборот"))rev=vals;
    else if(lab.includes("маржа")||lab.includes("прибыл"))marg=vals;
  }
  if(!year){const y=n(rows[hr][0]);year=y&&y>2000?String(Math.round(y)):String(new Date().getFullYear());}
  if(!rev)throw new ParseError("в файле плана не найдена строка «План оборот»");
  return {kind:"planfile",year,rev,marg:marg||Array(12).fill(null)};
}

/* --- 2.6 Квартальные бонусы, выплачиваемые поставщиком покупателю --- */
function parseBonus(wb,sheet){
  const rows=A(wb.Sheets[sheet]);
  const hr=findRow(rows,r=>colIdx(r,"бонус в руб")>=0,25);
  if(hr<0)throw new ParseError("в файле бонусов не найдена колонка «бонус в руб»");
  const H=rows[hr];
  const cPct=colIdx(H,"бонус в %"), cRub=colIdx(H,"бонус в руб");
  let q=null,year=null,base=null;
  const items=[];
  for(let i=hr+1;i<rows.length;i++){
    const r=rows[i]||[];const lab=clean(r[0]);
    if(!lab)continue;
    const mq=lab.match(/итог\s+(\d)-й\s+квартал\s+(\d{4})/i);
    if(mq){q=+mq[1];year=mq[2];continue;}
    const rub=n(r[cRub]);
    if(rub===null)continue;
    const isMkt=/маркетинг/i.test(lab);
    items.push({label:lab.replace(/\s*\d[\d\s\u00a0,\.]*руб\.?$/,"").trim(),
      full:lab, pct:n(r[cPct]), rub, mkt:isMkt});
  }
  for(let i=hr;i<rows.length;i++){const r=rows[i]||[];
    if(clean(r[1]).toLowerCase().startsWith("продажи без ндс"))base=n(r[2]);}
  if(!q){ // запасной вариант: ищем квартал в любой ячейке
    const t=cellsOf(rows,25).join("|");const m=t.match(/(\d)-й\s+квартал\s+(\d{4})/);
    if(m){q=+m[1];year=m[2];}
  }
  if(!q)throw new ParseError("в файле бонусов не определён квартал (искали «Итог N-й квартал ГГГГ»)");
  const total=items.reduce((a,b)=>a+b.rub,0);
  return {kind:"bonus",key:year+"-Q"+q,q,year,items,total,base};
}

/* --- 2.7 Книга ВИ: продажи конечным покупателям, матрица, остатки ВИ --- */
function parseVIWorkbook(wb){
  const out={kind:"viwb",sell:null,matrix:{},stock:[],notes:[]};
  for(const sn of wb.SheetNames){
    const low=clean(sn).toLowerCase();const rows=A(wb.Sheets[sn]);
    // Матрица товаров: GUID | Артикул поставщика | Наименование | Матрица
    if(low.includes("рица товаров")){
      const hr=findRow(rows,r=>colIdx(r,"артикул постав")>=0,10);
      if(hr>=0){const cA=colIdx(rows[hr],"артикул постав"),cM=colIdx(rows[hr],"матрица"),cN=colIdx(rows[hr],"наименование");
        // колонка «Матрица» содержит не флаг, а ABC-класс присвоенный ВсеИнструменты.ру: A / B / C / L / X
        for(let i=hr+1;i<rows.length;i++){const r=rows[i]||[];const a=clean(r[cA]);if(!a)continue;
          const cl=clean(r[cM]).toUpperCase();
          out.matrix[a.toUpperCase()]={cls:cl||null,name:clean(r[cN])};}}
      continue;
    }
    // Остатки ВИ: Supplier Name | Product Name | Quantity | Amount
    if(low==="остатки"){
      const hr=findRow(rows,r=>colIdx(r,"quantity")>=0&&colIdx(r,"amount")>=0,20);
      if(hr<0){out.notes.push("лист «Остатки» пропущен: не найдены колонки Quantity/Amount");continue;}
      const cN=colIdx(rows[hr],"product name"),cQ=colIdx(rows[hr],"quantity"),cAm=colIdx(rows[hr],"amount");
      for(let i=hr+1;i<rows.length;i++){const r=rows[i]||[];const nm=clean(r[cN]);const q=n(r[cQ]);
        if(!nm||q===null)continue;out.stock.push({name:nm,art:extractArt(nm),qty:q,amount:num(r[cAm])});}
      continue;
    }
    // Динамика продаж по СКЮ: сводная, строки = бренд + месяцы, колонки = метрика × год
    if(low.includes("продажи по ск")&&!out.sell){
      const hr=findRow(rows,r=>colIdx(r,"названия строк")>=0,25);
      if(hr<0)continue;
      const metricRow=rows[hr-1]||[],yearRow=rows[hr];
      let curMetric=null;const cols=[];
      for(let c=1;c<yearRow.length;c++){
        const mv=clean(metricRow[c]);if(mv)curMetric=mv;
        const y=n(yearRow[c]);if(y&&y>2000&&y<2100&&curMetric)cols.push({metric:curMetric,year:String(Math.round(y)),c});
      }
      if(!cols.length)continue;
      const groups=[];let cur=null;
      for(let i=hr+1;i<rows.length;i++){
        const r=rows[i]||[];const lab=clean(r[0]);if(!lab)continue;
        const mi=MONTHS_C.findIndex(m=>m.toLowerCase()===lab.toLowerCase());
        const vals={};cols.forEach(cc=>{const v=n(r[cc.c]);if(v!==null)vals[cc.metric+"|"+cc.year]=v;});
        if(mi<0){cur={name:lab,total:vals,months:[]};groups.push(cur);}
        else if(cur)cur.months.push({m:mi,vals});
      }
      out.sell={cols,groups};
      continue;
    }
    if(low.includes("регион"))out.notes.push("лист «Регионы» не используется: в выгрузке иерархия регион→город→SKU передана только отступами, которые не читаются из xlsx");
    if(low.includes("уперсет"))out.notes.push("лист «Суперсет» не используется: это сводка целей, а не транзакционные данные");
  }
  if(!out.sell&&!Object.keys(out.matrix).length&&!out.stock.length)
    throw new ParseError("книга ВИ распознана, но ни один из листов («Продажи по СКЮ», «Матрица товаров», «Остатки») не удалось разобрать");
  return out;
}

/* ================================================================================
   БЛОК 3. ЗАГРУЗКА ФАЙЛОВ И СЛИЯНИЕ ПЕРИОДОВ
   Любая загрузка (в том числе повторная за уже существующий период) запускает
   полный пересчёт всех вкладок без перезагрузки страницы.
   ================================================================================ */
async function handleFiles(fileList){
  const files=[...fileList];if(!files.length)return;
  const pend=[];  // конфликты по периодам решаем после разбора всех файлов
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array",cellDates:false});
      const det=detectType(wb);
      if(!det.type){
        toast("<b>"+esc(f.name)+"</b> — тип отчёта не распознан.<br>Листы: "+esc(wb.SheetNames.join(", "))+
              ".<br>Ожидались отчёт 1С «Валовая прибыль», PRICAT, справочник себестоимости, лист «МП», файл бонусов или книга ВИ.","err",11000);
        continue;
      }
      let res;
      switch(det.type){
        case "sales1c": res=parseSales1C(wb,det.sheet);break;
        case "costfile":res=parseCostFile(wb,det.sheet);break;
        case "pricat":  res=parsePricat(wb,det.sheet);break;
        case "mktplan": res=parseMktPlan(wb,det.sheet);break;
        case "bonus":   res=parseBonus(wb,det.sheet);break;
        case "planfile":res=parsePlanFile(wb,det.sheet);break;
        case "viwb":    res=parseVIWorkbook(wb);break;
      }
      res.fileName=f.name;
      if(res.kind==="sales1c")pend.push(res); else applyNonPeriodic(res);
    }catch(e){
      if(e instanceof ParseError)
        toast("<b>"+esc(f.name)+"</b> — ошибка разбора: "+esc(e.message)+".<br>"+
              "Похоже, площадка изменила формат выгрузки. Файл пропущен, остальные данные не затронуты.","err",12000);
      else{console.error(e);toast("<b>"+esc(f.name)+"</b> — файл не читается: "+esc(e.message),"err",9000);}
    }
  }
  if(pend.length)await ingestSales(pend); else finishLoad();
}

/* Наборы матрицы товаров ВИ. Период внутри файла не передаётся ничем, поэтому квартал угадываем
   по названию файла, а если не вышло — пользователь выбирает его сам на вкладке «Матрица ВИ». */
function guessQuarter(name){
  const s=String(name||"");
  const q=s.match(/(\d)[\s_\-]*(?:[йя][\s_\-]*)?кв(?:артал)?/i)||s.match(/\bQ([1-4])\b/i);
  const y=s.match(/20\d\d/);
  if(!q)return null;
  return (y?y[0]:String(new Date().getFullYear()))+"-Q"+q[1];
}
function addMatrixSet(r){
  const id=r.fileName||("set"+Date.now());
  S.matrixSets[id]={id,label:id.replace(/\.xlsx?$/i,""),quarter:guessQuarter(id),map:r.matrix,
    count:Object.keys(r.matrix).length};
  pickActiveMatrix();
}
/* Активный набор — тот, что выбран вручную, иначе с самым поздним кварталом, иначе последний загруженный. */
function pickActiveMatrix(){
  const sets=Object.values(S.matrixSets);
  if(!sets.length){S.matrix={};return;}
  let act=S.cfg.matrixActive&&S.matrixSets[S.cfg.matrixActive];
  if(!act){const dated=sets.filter(s=>s.quarter).sort((a,b)=>a.quarter<b.quarter?1:-1);
    act=dated[0]||sets[sets.length-1];}
  S.matrix=act.map;
}

/* Непериодические справочники просто замещают предыдущую версию. */
function applyNonPeriodic(r){
  if(r.kind==="costfile"){S.costFile=r.map;
    toast("Справочник себестоимости обновлён: <b>"+r.count+"</b> артикулов"+(r.withVat?" (с НДС)":""),"ok");}
  if(r.kind==="pricat"){S.pricat=r.map;
    toast("Каталог и остатки склада ГТВ РУС: <b>"+r.count+"</b> позиций","ok");}
  if(r.kind==="mktplan"){S.mkt=r;
    toast("Маркетинговый план "+r.year+": <b>"+r.acts.length+"</b> активностей с размещениями","ok");}
  if(r.kind==="bonus"){S.bonus[r.key]=r;
    toast("Бонусы "+r.q+"&nbsp;кв. "+r.year+": <b>"+money(r.total)+"</b>","ok");}
  if(r.kind==="planfile"){S.planFile=r;
    toast("Годовой план "+r.year+" загружен: оборот "+money(r.rev.reduce((a,b)=>a+(b||0),0))
      +", маржа "+money(r.marg.reduce((a,b)=>a+(b||0),0)),"ok",7000);}
  if(r.kind==="viwb"){
    if(r.sell)S.viSell=r.sell;
    if(Object.keys(r.matrix).length)addMatrixSet(r);
    if(r.stock.length)S.viStock=r.stock;
    toast("Данные ВсеИнструменты.ру загружены"+(r.notes.length?"<br><span class='xs mut'>"+r.notes.map(esc).join("<br>")+"</span>":""),"ok",8000);
  }
}

/* Слияние продаж: если период уже загружен — спрашиваем «заменить или объединить». */
async function ingestSales(list){
  for(const r of list){
    const ex=S.periods[r.key];
    if(ex&&ex.items&&ex.items.length){
      const mode=await askConflict(r,ex);
      if(mode==="skip")continue;
      if(mode==="replace")S.periods[r.key]=periodFrom(r);
      else S.periods[r.key]=mergePeriod(ex,r);
    }else S.periods[r.key]=periodFrom(r);
  }
  finishLoad();
}
function periodFrom(r){
  return {key:r.key,label:r.label,from:r.from,to:r.to,days:r.days,docs:r.docs,
    sources:[r.fileName],items:r.items,ret:r.ret,skippedDocRows:r.skippedDocRows,
    skippedDocRev:r.skippedDocRev,reportTotal:r.reportTotal};
}
function mergePeriod(ex,r){
  const mix=(a,b)=>{const map={};(a||[]).forEach(i=>map[i.art]={...i});
    (b||[]).forEach(i=>{const t=map[i.art];
      if(!t)map[i.art]={...i};
      else ["qty","rev","cost","pur","gross","retQty","retRev","lines"].forEach(k=>t[k]+=i[k]);});
    return Object.values(map);};
  const docs={...(ex.docs||{})};Object.entries(r.docs||{}).forEach(([k,v])=>docs[k]=(docs[k]||0)+v);
  return {key:ex.key,label:ex.label,from:ex.from<r.from?ex.from:r.from,to:ex.to>r.to?ex.to:r.to,
    days:Math.max(ex.days,r.days),docs,
    sources:[...(ex.sources||[]),r.fileName],
    items:mix(ex.items,r.items),
    ret:mergeRet(ex.ret,r.ret),
    skippedDocRows:(ex.skippedDocRows||0)+(r.skippedDocRows||0),
    skippedDocRev:(ex.skippedDocRev||0)+(r.skippedDocRev||0),
    reportTotal:(ex.reportTotal&&r.reportTotal)
      ?{rev:ex.reportTotal.rev+r.reportTotal.rev,cost:ex.reportTotal.cost+r.reportTotal.cost,
        gross:(ex.reportTotal.gross||0)+(r.reportTotal.gross||0),qty:null}
      :(ex.reportTotal||r.reportTotal)};
}
function mergeRet(a,b){
  const z={qty:0,rev:0,cost:0,pur:0,gross:0,docs:0,list:[]};
  [a,b].forEach(x=>{if(!x)return;["qty","rev","cost","pur","gross","docs"].forEach(k=>z[k]+=x[k]||0);
    z.list=z.list.concat(x.list||[]);});
  return z;
}
function askConflict(r,ex){
  return new Promise(res=>{
    modal(`<h3>Период «${esc(r.label)}» уже загружен</h3>
      <p class="hint">Загружен из: ${esc((ex.sources||[]).join(", "))} — ${ex.items.length} артикулов, выручка ${money(ex.items.reduce((a,b)=>a+b.rev,0))}.<br>
      Новый файл: ${esc(r.fileName)} — ${r.items.length} артикулов, выручка ${money(r.items.reduce((a,b)=>a+b.rev,0))}.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
        <button class="btn primary" data-a="replace">Заменить данными нового файла</button>
        <button class="btn" data-a="merge">Объединить (сложить строки)</button>
        <button class="btn ghost" data-a="skip">Пропустить файл</button>
      </div>
      <p class="hint" style="margin-top:14px">Заменяйте, если новый файл — обновлённая выгрузка за тот же период.
      Объединяйте, если файлы содержат разные части периода. Введённая вручную себестоимость и планы не сбрасываются в обоих случаях.</p>`,
    host=>{host.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{closeModal();res(b.dataset.a);});});
  });
}
function finishLoad(){
  const keys=Object.keys(S.periods).sort();
  if(!S.cur||(S.cur!=="ALL"&&!S.periods[S.cur]))S.cur=keys.length?keys[keys.length-1]:null;
  save();renderAll();  // полный пересчёт всех метрик, графиков, автовыводов и таблиц
  if(keys.length)toast("Пересчёт выполнен: периодов <b>"+keys.length+"</b>","ok",3500);
}

/* ================================================================================
   БЛОК 4. ОПРЕДЕЛЕНИЕ ИСТОЧНИКА СЕБЕСТОИМОСТИ
   Приоритет: из отчёта 1С → справочник себестоимости → вручную.
   Первые два помечаются как «из отчёта», третий — «вручную», иначе «не заполнено».
   «Закупочная цена» из PRICAT сюда НЕ входит: это расчётная цена продажи для ВсеИнструменты.ру,
   а не наши затраты — подставлять её как себестоимость означало бы обнулить всю маржу.
   ================================================================================ */
function unitCost(art,it){
  const vat=S.cfg.vatCost?S.cfg.vat:1;
  if(it&&it.qty>0&&it.cost){                       // 1С уже содержит себестоимость продаж
    return {v:it.cost/it.qty,src:"report",label:"из отчёта 1С"};
  }
  const cf=S.costFile[art];
  if(cf&&cf.v){return {v:cf.v/(cf.vat?vat:1),src:"report",label:"из справочника"+(cf.vat?" (÷НДС)":"")};}
  const mc=S.manualCost[art];
  if(mc!=null&&mc!==""&&isFinite(+mc))return {v:+mc,src:"manual",label:"вручную"};
  return {v:null,src:"none",label:"не заполнено"};
}

/* ================================================================================
   БЛОК 5. РАСЧЁТ МЕТРИК ПЕРИОДА
   Цепочка: выручка → себестоимость → бонусы → маркетинг → налог → чистая прибыль.
   Реклама и бонусы разносятся на артикул пропорционально доле в выручке.
   ================================================================================ */
function activePeriods(){
  const keys=Object.keys(S.periods).sort();
  if(!keys.length)return [];
  if(S.cur==="ALL")return keys.map(k=>S.periods[k]);
  return S.periods[S.cur]?[S.periods[S.cur]]:[];
}
function monthsOf(ps){return ps.map(p=>({y:+p.key.slice(0,4),m:+p.key.slice(5,7)-1,key:p.key}));}

/* Расход на рекламу за период — из маркетингового плана, по месяцам периода. */
function adSpend(ps){
  if(!S.mkt)return {v:null,detail:[],reason:"не загружен маркетинговый план (лист «МП»)"};
  const ms=monthsOf(ps).filter(x=>String(x.y)===String(S.mkt.year));
  if(!ms.length)return {v:null,detail:[],
    reason:"маркетинговый план загружен за "+S.mkt.year+" г., а выбранный период — за другой год"};
  const vat=S.cfg.vat;let sum=0;const detail=[];
  S.mkt.acts.forEach(a=>{
    let s=0,c=0;ms.forEach(x=>{s+=a.spend[x.m]*vat;c+=a.counts[x.m];});
    if(s>0){sum+=s;detail.push({name:a.name,group:a.group,detail:a.detail,count:c,spend:s,price:a.price*vat});}
  });
  detail.sort((a,b)=>b.spend-a.spend);
  return {v:sum,detail,months:ms.length};
}

/* Квартальные бонусы разносим на месяцы квартала пропорционально выручке этих месяцев. */
function bonusFor(ps,revByPeriod){
  const out={v:0,items:{},missing:[],skippedMkt:0};
  const qs={};
  monthsOf(ps).forEach(x=>{const q=Math.floor(x.m/3)+1;const k=x.y+"-Q"+q;(qs[k]=qs[k]||[]).push(x);});
  Object.keys(qs).forEach(k=>{
    const b=S.bonus[k];
    if(!b){out.missing.push(k.replace("-Q"," г., ")+" кв.");return;}
    // доля выбранных месяцев квартала в выручке всего квартала: считаем по загруженным месяцам квартала
    const allQ=Object.keys(S.periods).filter(pk=>{const y=+pk.slice(0,4),m=+pk.slice(5,7)-1;
      return y+"-Q"+(Math.floor(m/3)+1)===k;});
    const totQ=allQ.reduce((a,pk)=>a+sumRev(S.periods[pk]),0);
    const selQ=qs[k].reduce((a,x)=>a+(revByPeriod[x.key]||0),0);
    const share=totQ>0?selQ/totQ:1/3*qs[k].length;
    b.items.forEach(it=>{
      if(it.mkt&&S.cfg.skipMktBonus){out.skippedMkt+=it.rub*share;return;}
      const v=it.rub*share;if(!v)return;
      out.items[it.label]=(out.items[it.label]||0)+v;out.v+=v;
    });
  });
  return out;
}
const rowsOf=p=>p.items||[];
const sumRev=p=>rowsOf(p).reduce((a,b)=>a+b.rev,0);

function compute(){
  const ps=activePeriods();
  const M={ok:false,ps};
  if(!ps.length)return M;
  M.label=ps.length===1?ps[0].label:"Все периоды ("+ps.length+")";
  M.from=ps.map(p=>p.from).sort((a,b)=>toDate(a)-toDate(b))[0];
  M.to=ps.map(p=>p.to).sort((a,b)=>toDate(b)-toDate(a))[0];
  M.days=ps.reduce((a,p)=>a+p.days,0);
  M.docs={};ps.forEach(p=>Object.entries(p.docs||{}).forEach(([k,v])=>M.docs[k]=(M.docs[k]||0)+v));
  // справочная агрегированная строка «Возврат»: подытоги документов с отрицательным оборотом или прибылью
  M.ret=ps.reduce((z,p)=>mergeRet(z,p.ret),null)||{qty:0,rev:0,cost:0,gross:0,docs:0,list:[]};
  M.skippedDocRows=ps.reduce((a,p)=>a+(p.skippedDocRows||0),0);

  // --- агрегация по артикулу ---
  const items={},revByPeriod={};
  ps.forEach(p=>{
    revByPeriod[p.key]=sumRev(p);
    rowsOf(p).forEach(i=>{
      const t=items[i.art]||(items[i.art]={art:i.art,name:i.name,qty:0,rev:0,rcost:0,pur:0,gross:0,retQty:0,retRev:0});
      t.qty+=i.qty;t.rev+=i.rev;t.rcost+=i.cost;t.pur+=i.pur;t.gross+=i.gross;
      t.retQty+=i.retQty||0;t.retRev+=i.retRev||0;
      if(i.name&&i.name.length>t.name.length)t.name=i.name;
    });
  });
  const arr=Object.values(items);
  M.revenue=arr.reduce((a,b)=>a+b.rev,0);
  M.qty=arr.reduce((a,b)=>a+b.qty,0);

  // --- себестоимость и покрытие ---
  let cogs=0,covRev=0,covRepRev=0,covManRev=0,noneRev=0,cntNone=0,cntMan=0,cntRep=0;
  arr.forEach(t=>{
    const uc=unitCost(t.art,{qty:t.qty,cost:t.rcost});
    t.uc=uc.v;t.ucSrc=uc.src;t.ucLabel=uc.label;
    t.cat=catOf(t.art);
    t.price=t.qty!==0?t.rev/t.qty:null;
    // покрытие считаем по модулю выручки: строки возвратов дают отрицательную выручку
    // и без модуля доля «известной» себестоимости могла бы превысить 100%
    const aRev=Math.abs(t.rev);
    if(uc.v!=null){
      t.cogs=uc.v*t.qty; cogs+=t.cogs; covRev+=aRev;
      if(uc.src==="manual"){covManRev+=aRev;cntMan++;}else{covRepRev+=aRev;cntRep++;}
    }else{t.cogs=null;noneRev+=aRev;cntNone++;}
  });
  M.items=arr;
  M.cogs=cogs;
  const absRev=covRev+noneRev;
  M.cov={rev:covRev,repRev:covRepRev,manRev:covManRev,noneRev,
    pct:absRev?Math.min(1,covRev/absRev):0, cntNone,cntMan,cntRep,cnt:arr.length};

  // --- реклама и бонусы ---
  // Если в периоде не осталось ни одной строки (например, все документы — «Заказ клиента» и они исключены),
  // расходы не разносим: иначе получился бы фиктивный убыток на пустой выручке.
  M.empty=!arr.length;
  M.ad=M.empty?{v:null,detail:[],reason:"в периоде нет строк для расчёта"}:adSpend(ps);
  M.bonus=M.empty?{v:0,items:{},missing:[],skippedMkt:0}:bonusFor(ps,revByPeriod);
  const adV=M.ad.v||0, bnV=M.bonus.v||0;
  M.adV=adV;M.bnV=bnV;
  M.drr=M.revenue?adV/M.revenue:null;

  // --- налог и чистая прибыль ---
  const gross=M.revenue-cogs;                       // по известной себестоимости; непокрытая часть — без себестоимости
  M.grossFull=gross;
  M.tax=S.cfg.taxRate?Math.max(0,(gross-adV-bnV))*S.cfg.taxRate/100:0;
  M.net=gross-adV-bnV-M.tax;
  M.margin=M.revenue?M.net/M.revenue:null;
  M.roi=cogs?M.net/cogs:null;
  M.cogsPct=M.revenue?cogs/M.revenue:null;

  /* Разнесение рекламы и бонусов на артикул. База по умолчанию — выручка (рубли продаж),
     переключается на количество штук на вкладке «Данные». Разносится на все товары периода. */
  const byQty=S.cfg.adBase==="qty";
  const totQty=arr.reduce((a,b)=>a+Math.max(0,b.qty),0)||1;
  const shareBase=M.revenue||1;
  arr.forEach(t=>{
    t.share=t.rev/shareBase;
    t.adShare=byQty?Math.max(0,t.qty)/totQty:t.share;
    t.ad=adV*t.adShare; t.bn=bnV*t.adShare; t.taxA=M.tax*t.share;
    if(t.cogs!=null){
      t.grossP=t.rev-t.cogs;
      t.net=t.grossP-t.ad-t.bn-t.taxA;
      t.marginP=t.rev?t.net/t.rev:null;
      t.roiP=t.cogs?t.net/t.cogs:null;
      t.netUnit=t.qty?t.net/t.qty:null;
      t.drr=t.rev?t.ad/t.rev:null;
    }else{t.grossP=null;t.net=null;t.marginP=null;t.roiP=null;t.netUnit=null;t.drr=t.rev?t.ad/t.rev:null;}
    const pc=S.pricat[t.art];
    t.stock=pc?pc.stock:null;
    t.retail=pc?pc.retail:null;
    t.viPrice=pc?pc.viPrice:null;   // прайсовая цена для ВИ из PRICAT
    /* Прайс в PRICAT указан с НДС, выручка в 1С — без НДС. Разница 100% − цена/прайс должна равняться
       ставке налога. Больше 22% — значит отгружали дешевле прайса, то есть со скидкой. */
    t.vatRatio=(t.viPrice&&t.price)?1-t.price/t.viPrice:null;
    t.brand=pc?pc.brand:null;
    t.speed=M.days?t.qty/M.days:0;
    t.daysLeft=(t.stock!=null&&t.speed>0)?t.stock/t.speed:(t.stock!=null?Infinity:null);
    t.inMatrix=S.matrix[t.art]?S.matrix[t.art].cls:null;
  });

  /* Коэффициент перевода РРЦ → закупочная цена. Sell-in идёт по нашей отпускной (она же «закупочная»
     в PRICAT), sell-out у ВИ — по РРЦ, поэтому напрямую эти суммы несопоставимы. Коэффициент берём
     из PRICAT как отношение рекомендованной цены к закупочной, взвешенно по выручке проданных SKU. */
  if(S.cfg.rrcK){M.rrcK={v:+S.cfg.rrcK,src:"задан вручную",nn:null};}
  else{
    let wsum=0,w=0,nn=0;
    arr.forEach(t=>{const pc=S.pricat[t.art];
      if(pc&&pc.viPrice>0&&pc.retail>0&&t.rev>0){const k=pc.retail/pc.viPrice;
        if(k>1&&k<5){wsum+=k*t.rev;w+=t.rev;nn++;}}});
    if(w>0)M.rrcK={v:wsum/w,src:"из PRICAT, взвешенно по выручке",nn};
    else{
      const ks=Object.values(S.pricat).filter(p=>p.viPrice>0&&p.retail>0).map(p=>p.retail/p.viPrice)
        .filter(k=>k>1&&k<5).sort((a,b)=>a-b);
      M.rrcK=ks.length?{v:ks[Math.floor(ks.length/2)],src:"медиана по каталогу PRICAT",nn:ks.length}:null;
    }
  }

  /* ABC. По выручке рассчитываем сами (накопленный вклад 80/95/100).
     По прибыли группы НЕ рассчитываем: класс берётся из колонки «Матрица» файла «Матрица товаров» —
     это классификация самой ВсеИнструменты.ру (A / B / C / L / X). Товары вне матрицы в разрез не попадают. */
  abc(arr,"rev","abcRev");
  arr.forEach(t=>{const m=S.matrix[t.art];t.abcNet=(m&&m.cls)?m.cls:null;});
  M.noMatrix=arr.filter(t=>!t.abcNet).length;

  // --- категории ---
  const cats={};
  arr.forEach(t=>{const c=cats[t.cat]||(cats[t.cat]={cat:t.cat,cnt:0,qty:0,rev:0,cogs:0,net:0,unknown:0});
    c.cnt++;c.qty+=t.qty;c.rev+=t.rev;
    if(t.cogs!=null){c.cogs+=t.cogs;c.net+=t.net;}else c.unknown++;});
  Object.values(cats).forEach(c=>{c.margin=c.rev?c.net/c.rev:null;c.share=M.revenue?c.rev/M.revenue:0;});
  M.cats=Object.values(cats).sort((a,b)=>b.rev-a.rev);

  // --- проблемные позиции ---
  M.loss=arr.filter(t=>t.net!=null&&t.net<0);
  M.lossSum=M.loss.reduce((a,b)=>a+b.net,0);
  M.crit=arr.filter(t=>t.daysLeft!=null&&isFinite(t.daysLeft)&&t.daysLeft<S.cfg.critDays&&t.qty>0);
  M.warnSt=arr.filter(t=>t.daysLeft!=null&&isFinite(t.daysLeft)&&t.daysLeft>=S.cfg.critDays&&t.daysLeft<S.cfg.warnDays&&t.qty>0);
  M.attention=M.loss.length+M.crit.length;
  M.dropCand=arr.filter(t=>t.abcRev==="C"&&t.net!=null&&t.net<0&&t.qty>0);
  M.ok=true;
  return M;
}
function abc(list,field,out){
  const s=[...list].sort((a,b)=>b[field]-a[field]);
  const tot=s.reduce((a,b)=>a+Math.max(0,b[field]),0);
  let acc=0;
  s.forEach(t=>{acc+=Math.max(0,t[field]);const r=tot?acc/tot:1;
    t[out]=r<=0.8?"A":r<=0.95?"B":"C";});
  list.forEach(t=>{if(!t[out])t[out]="C";});
}

/* ================================================================================
   БЛОК 6. АВТОМАТИЧЕСКИЕ ТЕКСТОВЫЕ ВЫВОДЫ
   ================================================================================ */
function insights(M){
  const o=[];
  const add=(k,ic,html)=>o.push({k,ic,html});

  if(M.ret&&M.ret.docs)
    add("warn","↩",`Возвраты: <b>${M.ret.docs}</b> ${plur(M.ret.docs,"документ","документа","документов")}
      на <b>${money(M.ret.rev)}</b> оборота и <b>${money(M.ret.gross)}</b> валовой прибыли
      (${f0(-M.ret.qty)} шт). Собраны в одну справочную строку «Возврат» на вкладках «Товары» и «Юнит-экономика».`);

  if(M.cov.pct<0.999){
    const p=1-M.cov.pct;
    add(p>0.15?"warn":"info","◐",`Себестоимость известна по <b>${pct(M.cov.pct)}</b> выручки
      (${M.cov.cntRep} товаров из отчётов, ${M.cov.cntMan} введено вручную).
      По <b>${M.cov.cntNone}</b> товарам на <b>${money(M.cov.noneRev)}</b> выручки себестоимости нет —
      прибыль по ним не считается вообще, а не считается нулём. Заполните их на вкладке «Юнит-экономика».`);
  }else if(M.cov.cnt)add("ok","✓","Себестоимость известна по всем товарам периода — цифрам прибыли можно доверять полностью.");

  if(M.loss.length)add("bad","▼",`В убыток продаётся <b>${M.loss.length}</b> ${plur(M.loss.length,"товар","товара","товаров")}
    на <b>${money(-M.lossSum)}</b> потерянной прибыли. Крупнейший минус: ${esc(M.loss.sort((a,b)=>a.net-b.net)[0].name.slice(0,60))} (${money(M.loss[0].net)}).`);
  else if(M.cov.cnt)add("ok","✓","Товаров с отрицательной чистой прибылью в периоде нет.");

  const cc=M.cats.filter(c=>c.margin!=null&&c.rev>0);
  if(cc.length>1){
    const best=[...cc].sort((a,b)=>b.margin-a.margin)[0], worst=[...cc].sort((a,b)=>a.margin-b.margin)[0];
    add("info","≡",`Лучшая маржа у категории <b>${esc(best.cat)}</b> — ${pct(best.margin)} при выручке ${money(best.rev)}.
      Худшая у <b>${esc(worst.cat)}</b> — ${pct(worst.margin)}.`);
  }
  if(M.crit.length||M.warnSt.length)
    add(M.crit.length?"bad":"warn","◧",`Меньше чем через ${S.cfg.critDays} дней закончится <b>${M.crit.length}</b>
      ${plur(M.crit.length,"товар","товара","товаров")}, ещё <b>${M.warnSt.length}</b> — в пределах ${S.cfg.warnDays} дней.
      Скорость продаж считается по фактическим продажам за ${M.days} ${plur(M.days,"день","дня","дней")} периода.`);
  else if(Object.keys(S.pricat).length)add("ok","✓","Критичных по остаткам товаров нет: всем позициям хватает больше "+S.cfg.critDays+" дней.");
  else add("warn","◧","Остатки не загружены — блок «Остатки» и рекомендации по поставке недоступны. Нужен файл PRICAT с колонкой «Количество остатков на складе».");

  if(M.drr!=null){
    const d=M.drr*100,lo=S.cfg.drrLo,hi=S.cfg.drrHi;
    const verdict=d<lo?`ниже ориентира ${lo}–${hi}% — рекламный ресурс недоиспользован, есть запас на продвижение`
      :d>hi?`выше ориентира ${lo}–${hi}% — реклама съедает больше нормы, стоит пересмотреть размещения`
      :`в пределах ориентира ${lo}–${hi}%`;
    add(d>hi?"bad":d<lo?"info":"ok","◇",`ДРР каталога — <b>${pct(M.drr)}</b> (${money(M.adV)} рекламы на ${money(M.revenue)} выручки), ${verdict}.`);
  }else add("warn","◇","ДРР не рассчитан: "+esc(M.ad.reason||"нет данных о рекламе")+".");

  if(M.dropCand.length){
    const s=M.dropCand.reduce((a,b)=>a+b.net,0);
    add("warn","✕",`<b>${M.dropCand.length}</b> ${plur(M.dropCand.length,"товар","товара","товаров")} одновременно
      в группе C по выручке и убыточны (${money(s)}) — кандидаты на вывод из ассортимента.`);
  }
  // точки роста: товары с положительной юниткой, высокой маржой и остатком, но малой долей выручки
  const growth=M.items.filter(t=>t.marginP!=null&&t.marginP>(M.margin||0)*1.3&&t.abcRev!=="A"&&t.qty>0&&(t.stock==null||t.stock>0));
  if(growth.length){
    const pot=growth.reduce((a,t)=>a+t.net*0.5,0);
    add("info","▲",`Найдено <b>${growth.length}</b> точек роста: товары с маржой выше средней по каталогу,
      но не входящие в группу A по выручке. Рост их продаж на 50% дал бы примерно <b>${money(pot)}</b> дополнительной прибыли.`);
  }
  if(M.bonus.missing.length)
    add("warn","₽","Бонусы не учтены за: "+M.bonus.missing.map(esc).join(", ")+" — загрузите файл «Сумма бонусов» за этот квартал.");
  if(M.bonus.skippedMkt>0)
    add("info","₽",`Маркетинговый бонус <b>${money(M.bonus.skippedMkt)}</b> не вычтен отдельной строкой:
      он является источником финансирования маркетингового плана и уже учтён через строку «Реклама». Переключается на вкладке «Данные».`);
  return o;
}
function plur(k,a,b,c){k=Math.abs(Math.round(k));const d=k%100;if(d>10&&d<20)return c;
  const e=k%10;return e===1?a:e>1&&e<5?b:c;}

/* ================================================================================
   БЛОК 7. ГРАФИКИ. Рисуем инлайновым SVG — без сторонних чарт-библиотек,
   чтобы файл оставался самодостаточным и не зависел от доступности CDN.
   ================================================================================ */
function svgWaterfall(steps,w,h){
  w=w||760;h=h||300;const pad={l:8,r:8,t:26,b:52};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b, bw=iw/steps.length*0.62, gap=iw/steps.length;
  let run=0;const pts=steps.map((s,i)=>{const from=s.total?0:run;const to=s.total?s.v:run+s.v;
    if(!s.total)run+=s.v;else run=s.v;return {...s,from,to,i};});
  const all=pts.flatMap(p=>[p.from,p.to]).concat([0]);
  const mx=Math.max(...all),mn=Math.min(...all),rng=(mx-mn)||1;
  const Y=v=>pad.t+ih-(v-mn)/rng*ih;
  let g="";
  pts.forEach(p=>{
    const x=pad.l+p.i*gap+(gap-bw)/2;
    const y1=Y(p.from),y2=Y(p.to),y=Math.min(y1,y2),hh=Math.max(2,Math.abs(y2-y1));
    const col=p.total?"var(--acc)":(p.v>=0?"var(--ok)":"var(--bad)");
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="${col}" opacity="${p.total?1:.82}"/>`;
    g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--tx)">${short(p.v)}</text>`;
    const words=p.name.split(" ");let ln=[],cur="";
    words.forEach(wd=>{if((cur+" "+wd).trim().length>13){ln.push(cur);cur=wd;}else cur=(cur+" "+wd).trim();});
    ln.push(cur);ln=ln.slice(0,2);
    ln.forEach((t,k)=>{g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(pad.t+ih+16+k*12).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--tx2)">${esc(t)}</text>`;});
    if(p.i<pts.length-1&&!pts[p.i+1].total){const xe=pad.l+(p.i+1)*gap+(gap-bw)/2;
      g+=`<line x1="${(x+bw).toFixed(1)}" y1="${y2.toFixed(1)}" x2="${xe.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--line2)" stroke-dasharray="3 3"/>`;}
  });
  g+=`<line x1="${pad.l}" y1="${Y(0).toFixed(1)}" x2="${w-pad.r}" y2="${Y(0).toFixed(1)}" stroke="var(--line2)"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${g}</svg>`;
}
function svgDonut(parts,w){
  w=w||230;const r=w/2-6,ir=r*0.62,cx=w/2,cy=w/2;
  const tot=parts.reduce((a,b)=>a+Math.abs(b.v),0)||1;let a0=-Math.PI/2,g="";
  parts.forEach(p=>{
    const a1=a0+Math.abs(p.v)/tot*Math.PI*2;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const xi1=cx+ir*Math.cos(a1),yi1=cy+ir*Math.sin(a1),xi0=cx+ir*Math.cos(a0),yi0=cy+ir*Math.sin(a0);
    const big=(a1-a0)>Math.PI?1:0;
    g+=`<path d="M${x0} ${y0}A${r} ${r} 0 ${big} 1 ${x1} ${y1}L${xi1} ${yi1}A${ir} ${ir} 0 ${big} 0 ${xi0} ${yi0}Z" fill="${p.c}" opacity=".92"/>`;
    a0=a1;
  });
  return `<svg viewBox="0 0 ${w} ${w}" style="width:${w}px;max-width:100%;height:auto">${g}</svg>`;
}
function svgBars(data,w,h,fmt){
  w=w||620;h=h||220;const pad={l:8,r:8,t:18,b:44};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,gap=iw/data.length,bw=gap*0.6;
  const mx=Math.max(1,...data.map(d=>d.v));let g="";
  data.forEach((d,i)=>{
    const bh=Math.max(2,d.v/mx*ih),x=pad.l+i*gap+(gap-bw)/2,y=pad.t+ih-bh;
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${d.c||"var(--acc)"}" opacity=".88"/>`;
    g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--tx)">${fmt?fmt(d.v):d.v}</text>`;
    g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(pad.t+ih+16).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--tx2)">${esc(d.l)}</text>`;
    if(d.l2)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(pad.t+ih+29).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--tx3)">${esc(d.l2)}</text>`;
  });
  g+=`<line x1="${pad.l}" y1="${pad.t+ih}" x2="${w-pad.r}" y2="${pad.t+ih}" stroke="var(--line2)"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${g}</svg>`;
}
function svgLines(series,labels,w,h){
  w=w||760;h=h||260;const pad={l:56,r:12,t:16,b:34};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const all=series.flatMap(s=>s.v).filter(v=>isFinite(v));
  if(!all.length)return "";
  let mx=Math.max(...all,0),mn=Math.min(...all,0);const rng=(mx-mn)||1;
  const X=i=>pad.l+(labels.length<2?iw/2:i/(labels.length-1)*iw);
  const Y=v=>pad.t+ih-(v-mn)/rng*ih;
  let g="";
  for(let k=0;k<=4;k++){const v=mn+rng*k/4,y=Y(v);
    g+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`;
    g+=`<text x="${pad.l-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--tx3)">${short(v)}</text>`;}
  series.forEach(s=>{
    const d=s.v.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;
    s.v.forEach((v,i)=>{g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.2" fill="${s.c}"/>`;});
  });
  labels.forEach((l,i)=>{g+=`<text x="${X(i).toFixed(1)}" y="${(h-12)}" text-anchor="middle" font-size="10" fill="var(--tx2)">${esc(l)}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${g}</svg>`;
}

const T={}; // состояние таблиц: {sort, dir, q, cat, srcFilter}

function sortRows(rows,st){
  const k=st.sort,d=st.dir;
  return [...rows].sort((a,b)=>{
    let x=a[k],y=b[k];
    if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
    if(typeof x==="string")return d*x.localeCompare(y,"ru");
    return d*(x-y);
  });
}
function th(id,key,label,tip){

  return `<th data-tb="${id}" data-k="${key}"${tip?' title="'+esc(tip)+'"':""}>${esc(label)}${on?'<span class="ar">'+(st.dir<0?"▾":"▴")+"</span>":""}</th>`;
}
/* Заголовок «Артикул» с точечным фильтром: клик по значку раскрывает поле ввода прямо в шапке столбца. */

function bindTables(root){
  root.querySelectorAll("[data-artopen]").forEach(el=>{
    el.onclick=e=>{e.stopPropagation();const st=tstate(el.dataset.artopen);
      st.artOpen=!st.artOpen; if(!st.artOpen)st.art="";

  });
  root.querySelectorAll("[data-k]").forEach(el=>{

      if(st.sort===el.dataset.k)st.dir*=-1;else{st.sort=el.dataset.k;st.dir=-1;}

  });

    el.onchange=()=>{

function bindTools(root){

function filterRows(rows,id){
  const st=tstate(id);const q=st.q.trim().toLowerCase();
  const a=(st.art||"").trim().toUpperCase();
  if(a){
    // сначала точное совпадение, и только если его нет — совпадение по началу артикула
    const exact=rows.filter(t=>String(t.art).toUpperCase()===a);
    rows=exact.length?exact:rows.filter(t=>String(t.art).toUpperCase().startsWith(a));
  }
  return rows.filter(t=>{
    if(st.cat&&t.cat!==st.cat)return false;
    if(st.src&&t.ucSrc!==st.src)return false;
    if(q&&!((t.name||"").toLowerCase().includes(q)||(t.art||"").toLowerCase().includes(q)))return false;
    return true;
  });
}

        Показана сумма чистой прибыли по каждому классу.</p>

            <span class="num">${short(d.v)} · ${pct(d.v/dTot,0)} · ${cnt} SKU</span></div>`;}).join("")}
          <p class="hint" style="margin-top:10px">Не учтено: без себестоимости — ${M.cov.cntNone}, вне матрицы ВИ — ${M.noMatrix}</p>

  <div class="grid2">
    <div class="card"><h3>Топ-15 по прибыли</h3>${miniList(top,"pos")}</div>
    <div class="card"><h3>Антитоп-15 по прибыли</h3>
      <p class="hint">Только позиции с положительными продажами. Товары, по которым за период были одни возвраты
        (${retOnly} ${plur(retOnly,"позиция","позиции","позиций")}), в список не попадают — их минус означает возврат, а не убыточную продажу.</p>
      ${miniList(bot,"neg")}</div>
  </div>`;
  el.querySelectorAll("[data-delsnap]").forEach(b=>b.onclick=()=>{
    S.snaps.splice(+b.dataset.delsnap,1);save();renderAll();});
}
function miniList(list,k){
  if(!list.length)return `<div class="empty">Нет товаров с рассчитанной прибылью</div>`;
  return `<div class="tw" style="max-height:430px"><table><thead><tr>
    <th class="nos">Товар</th><th class="nos">Шт</th><th class="nos">Выручка</th><th class="nos">Прибыль</th><th class="nos">Маржа</th></tr></thead>
    <tbody>${list.map(t=>`<tr><td class="nm"><span class="art">${esc(t.art)}</span> ${esc(t.name.slice(0,70))}</td>
      <td class="num">${f0(t.qty)}</td><td class="num">${short(t.rev)}</td>
      <td class="num ${k}">${short(t.net)}</td><td class="num ${cls(t.marginP)}">${pct(t.marginP)}</td></tr>`).join("")}
    </tbody></table></div>`;
}

/* ---------- Вкладка «План-факт» ----------
   План берётся из годового файла «План оборот / План маржа», ручной ввод его переопределяет.
   Маржа здесь ВАЛОВАЯ: выручка минус себестоимость, без вычета рекламы и бонусов —
   именно так построен плановый файл, иначе план и факт сравнивались бы в разных базах. */
function planFor(key){
  const manual=S.plan[key]||{};
  const y=key.slice(0,4), m=+key.slice(5,7)-1;
  const pf=(S.planFile&&String(S.planFile.year)===y)?S.planFile:null;
  const rev=n(manual.rev)!=null?n(manual.rev):(pf?pf.rev[m]:null);
  const prof=n(manual.profit)!=null?n(manual.profit):(pf?pf.marg[m]:null);
  return {rev,prof,src:(n(manual.rev)!=null?"вручную":pf?"из файла плана":null),manual,pf};
}
/* Факт для этой вкладки: валовая прибыль, без рекламы и бонусов. */
function grossOf(p){
  return (p.items||[]).reduce((a,t)=>a+t.rev,0)-(p.items||[]).reduce((a,t)=>{
    const uc=unitCost(t.art,{qty:t.qty,cost:t.cost});return a+(uc.v!=null?uc.v*t.qty:0);},0);
}

function renderPlanFact(M){
  const el=document.getElementById("tab-pf");
  if(!M.ok){el.innerHTML=emptyState();return;}
  const allKeys=Object.keys(S.periods).sort();
  const isAll=S.cur==="ALL";

  /* ---- режим «Все периоды»: помесячный план-факт ---- */
  if(isAll){
    const rows=allKeys.map(k=>{
      const p=S.periods[k],pl=planFor(k);
      const fact=sumRev(p), gross=grossOf(p);
      return {k,label:MONTHS_C[+k.slice(5,7)-1].slice(0,3),full:p.label,
        planRev:pl.rev,fact,planProf:pl.prof,gross,
        doneRev:pl.rev?fact/pl.rev:null, doneProf:pl.prof?gross/pl.prof:null};
    });
    const sum=(f)=>rows.reduce((a,r)=>a+(r[f]||0),0);
    const yearPlan=S.planFile?S.planFile.rev.reduce((a,b)=>a+(b||0),0):null;
    const yearMarg=S.planFile?S.planFile.marg.reduce((a,b)=>a+(b||0),0):null;
    el.innerHTML=`
    ${!S.planFile?`<div class="card"><div class="ins warn"><span class="ic">◐</span><div>
      Годовой план не загружен. Нужен файл со строками «План оборот ГГГГ» и «План маржа ГГГГ» и колонками-месяцами —
      загрузите его кнопкой «Загрузить отчёты», и плановые значения проставятся по каждому месяцу автоматически.</div></div></div>`:""}
    <div class="card">
      <h3>Оборот по месяцам: план и факт</h3>
      <p class="hint">Оранжевым — план из файла${S.planFile?" на "+esc(S.planFile.year)+" год":""}, синим — факт по загруженным отчётам 1С.
        В скобках под фактом — процент выполнения плана месяца. Значения в тысячах рублей.
        Месяцы без загруженного отчёта показывают нулевой факт: это отсутствие данных, а не провал плана.</p>
      ${svgGrouped(rows.map(r=>r.label),[
        {n:"План",v:rows.map(r=>Math.round((r.planRev||0)/1000)),c:"var(--acc)",
         lab:rows.map(r=>r.planRev?f0(r.planRev/1000):"—")},
        {n:"Факт",v:rows.map(r=>Math.round(r.fact/1000)),c:"var(--info)",
         lab:rows.map(r=>f0(r.fact/1000)+(r.doneRev!=null?"\n("+pct(r.doneRev,0)+")":""))}],880,300)}
      <div class="legend"><span><i style="background:var(--acc)"></i>План, тыс ₽</span>
        <span><i style="background:var(--info)"></i>Факт, тыс ₽</span></div>
    </div>

    <div class="card">
      <h3>Валовая маржа по месяцам: план и факт</h3>
      <p class="hint">Факт — выручка минус себестоимость, без вычета рекламы и бонусов: плановый файл построен именно в этой базе.
        В скобках под фактом — процент выполнения. Значения в тысячах рублей.</p>
      ${svgGrouped(rows.map(r=>r.label),[
        {n:"План",v:rows.map(r=>Math.round((r.planProf||0)/1000)),c:"var(--acc)",
         lab:rows.map(r=>r.planProf?f0(r.planProf/1000):"—")},
        {n:"Факт",v:rows.map(r=>Math.round(r.gross/1000)),c:"var(--ok)",
         lab:rows.map(r=>f0(r.gross/1000)+(r.doneProf!=null?"\n("+pct(r.doneProf,0)+")":""))}],880,300)}
      <div class="legend"><span><i style="background:var(--acc)"></i>План, тыс ₽</span>
        <span><i style="background:var(--ok)"></i>Факт, тыс ₽</span></div>
    </div>

    <div class="card">
      <h3>Достижение по месяцам</h3>
      <div class="tw"><table><thead><tr>
        <th class="nos">Месяц</th><th class="nos">План оборота</th><th class="nos">Факт оборота</th>
        <th class="nos">Выполнение</th><th class="nos">Отклонение</th>
        <th class="nos">План маржи</th><th class="nos">Факт маржи</th><th class="nos">Выполнение</th>
        <th class="nos">Маржа, %</th><th class="nos">Итог</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td>${esc(r.full)}</td>
          <td class="num">${r.planRev?short(r.planRev):"—"}</td>
          <td class="num">${short(r.fact)}</td>
          <td class="num ${r.doneRev==null?"":r.doneRev>=1?"pos":"neg"}">${r.doneRev==null?"—":pct(r.doneRev,0)}</td>
          <td class="num ${r.planRev?cls(r.fact-r.planRev):""}">${r.planRev?(r.fact-r.planRev>0?"+":"")+short(r.fact-r.planRev):"—"}</td>
          <td class="num">${r.planProf?short(r.planProf):"—"}</td>
          <td class="num">${short(r.gross)}</td>
          <td class="num ${r.doneProf==null?"":r.doneProf>=1?"pos":"neg"}">${r.doneProf==null?"—":pct(r.doneProf,0)}</td>
          <td class="num mut">${pct(r.fact?r.gross/r.fact:null)}</td>
          <td>${r.doneRev==null?'<span class="tag n">нет плана</span>'
            :r.doneRev>=1?'<span class="tag ok">достигнут</span>'
            :r.doneRev>=0.9?'<span class="tag warn">почти</span>':'<span class="tag bad">не достигнут</span>'}</td></tr>`).join("")}
        </tbody>
        <tfoot><tr><td>Итого за загруженные месяцы</td>
          <td class="num">${short(sum("planRev"))}</td><td class="num">${short(sum("fact"))}</td>
