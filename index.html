          <td class="num ${cls(sum("fact")-sum("planRev"))}">${sum("planRev")?short(sum("fact")-sum("planRev")):"—"}</td>
          <td class="num">${short(sum("planProf"))}</td><td class="num">${short(sum("gross"))}</td>
          <td class="num ${sum("planProf")&&sum("gross")>=sum("planProf")?"pos":"neg"}">${sum("planProf")?pct(sum("gross")/sum("planProf"),0):"—"}</td>
          <td class="num">${pct(sum("fact")?sum("gross")/sum("fact"):null)}</td><td></td></tr></tfoot>
      </table></div>
      ${yearPlan?`<p class="hint" style="margin-top:10px">Годовой план: оборот ${money(yearPlan)}, валовая маржа ${money(yearMarg)}.
        Загружено ${rows.length} ${plur(rows.length,"месяц","месяца","месяцев")} — это ${pct(sum("fact")/yearPlan,0)} годового оборота
        и ${pct(sum("gross")/yearMarg,0)} годовой маржи.</p>`:""}
    </div>`;
    return;
  }

  /* ---- режим одного месяца ---- */
  const planKey=S.cur;
  const pl=planFor(planKey);
  const now=new Date();
  const py=+planKey.slice(0,4),pm=+planKey.slice(5,7);
  const dim=new Date(py,pm,0).getDate();
  const sameMonth=(now.getFullYear()===py&&now.getMonth()+1===pm);
  const isPast=(py<now.getFullYear())||(py===now.getFullYear()&&pm<now.getMonth()+1);
  const elapsed=sameMonth?now.getDate():(isPast?dim:0);
  const pace=elapsed/dim;

  const factGross=M.grossFull;                 // без рекламы и бонусов
  const planRev=pl.rev, planProfit=pl.prof;
  const avgPrice=M.qty?M.revenue/M.qty:null;
  const planQty=planRev&&avgPrice?planRev/avgPrice:null;
  const perDay=M.days?M.revenue/M.days:0;
  const daysLeft=Math.max(0,dim-elapsed);
  const need=planRev?Math.max(0,planRev-M.revenue):0;
  const needPerDay=daysLeft>0?need/daysLeft:null;

  el.innerHTML=`
  <div class="card">
    <h3>План на ${esc(MONTHS_C[pm-1]+" "+py)}</h3>
    <p class="hint">Плановые значения подставляются из годового файла${pl.src?" ("+esc(pl.src)+")":""}; введённое вручную число его переопределяет и хранится в браузере.
      Маржа на этой вкладке — <b>валовая</b>: выручка минус себестоимость, без вычета рекламы и бонусов, потому что плановый файл построен в этой же базе.</p>
    <div class="grid3">
      <div><div class="lab small mut">Плановый оборот, ₽</div>
        <input class="inp" type="number" id="planRev" value="${pl.manual.rev||""}" placeholder="${planRev?f0(planRev)+" — из файла плана":"нет плана"}"></div>
      <div><div class="lab small mut">Плановая валовая маржа, ₽</div>
        <input class="inp" type="number" id="planProfit" value="${pl.manual.profit||""}" placeholder="${planProfit?f0(planProfit)+" — из файла плана":"нет плана"}"></div>
      <div><div class="lab small mut">План по количеству, шт (расчётный)</div>
        <input class="inp" value="${planQty?f0(planQty)+" шт при средней цене "+f0(avgPrice)+" ₽":"— нужен плановый оборот"}" disabled></div>
    </div>
  </div>

  <div class="card">
    <h3>Выполнение</h3>
    <p class="hint">Метка на полосе — ожидаемый процент выполнения на сегодня (${elapsed} из ${dim} дней месяца = ${pct(pace,0)}).</p>
    ${progressBlock("Оборот",M.revenue,planRev,pace,money)}
    ${progressBlock("Валовая маржа",factGross,planProfit,pace,money)}
    ${planQty?progressBlock("Количество, шт",M.qty,planQty,pace,f0):""}
    <div class="grid3" style="margin-top:14px">
      <div><div class="lab small mut">Плановая маржинальность</div>
        <div class="num" style="font-size:20px">${pct(planRev&&planProfit?planProfit/planRev:null)}</div></div>
      <div><div class="lab small mut">Фактическая маржинальность</div>
        <div class="num" style="font-size:20px;color:${(planRev&&planProfit&&M.revenue&&factGross/M.revenue>=planProfit/planRev)?"var(--ok)":"var(--warn)"}">
          ${pct(M.revenue?factGross/M.revenue:null)}</div></div>
      <div><div class="lab small mut">Справочно: чистая прибыль</div>
        <div class="num ${cls(M.net)}" style="font-size:20px">${money(M.net)}</div>
        <div class="small mut">после рекламы ${money(M.adV)} и бонусов ${money(M.bnV)}</div></div>
    </div>
  </div>

  <div class="card">
    <h3>Нужный темп</h3>
    ${planRev?`<div class="grid3">
      <div><div class="lab small mut">Средний оборот в день (факт)</div><div class="num" style="font-size:22px">${money(perDay)}</div>
        <div class="small mut">за ${M.days} ${plur(M.days,"день","дня","дней")} загруженных данных</div></div>
      <div><div class="lab small mut">Нужно в день до конца месяца</div>
        <div class="num" style="font-size:22px;color:${needPerDay==null?"var(--tx2)":needPerDay>perDay?"var(--bad)":"var(--ok)"}">
          ${needPerDay==null?"—":money(needPerDay)}</div>
        <div class="small mut">${daysLeft} ${plur(daysLeft,"день","дня","дней")} осталось · нужно ещё ${money(need)}</div></div>
      <div><div class="lab small mut">Сравнение</div>
        <div style="font-size:15px;margin-top:6px">${needPerDay==null?'<span class="tag ok">План уже выполнен</span>'
          :needPerDay>perDay?`<span class="tag bad">темп нужно поднять на ${pct(needPerDay/perDay-1,0)}</span>`
          :`<span class="tag ok">текущего темпа хватает с запасом ${pct(1-needPerDay/Math.max(perDay,1),0)}</span>`}</div></div>
    </div>`:`<div class="empty">Загрузите файл годового плана или задайте плановый оборот вручную.</div>`}
  </div>

  <div class="card">
    <h3>План по категориям</h3>
    <p class="hint">Необязательно. Факт — валовая маржа категории, чтобы база совпадала с верхними блоками.</p>
    <div class="tw" style="max-height:440px"><table><thead><tr>
      <th class="nos">Категория</th><th class="nos">План оборота, ₽</th><th class="nos">Факт</th>
      <th class="nos">Выполнение</th><th class="nos">Темп</th></tr></thead>
      <tbody>${M.cats.map(c=>{const cp=n((pl.manual.cats||{})[c.cat]);
        const r=cp?c.rev/cp:null;
        return `<tr><td class="nm">${esc(c.cat)}</td>
        <td><input class="costin" style="width:130px" type="number" data-catplan="${esc(c.cat)}" value="${(pl.manual.cats||{})[c.cat]||""}"></td>
        <td class="num">${short(c.rev)}</td>
        <td class="num ${r==null?"":r>=pace?"pos":"neg"}">${r==null?"—":pct(r,0)}</td>
        <td>${r==null?"":paceTag(r,pace)}</td></tr>`;}).join("")}
      </tbody></table></div>
  </div>`;

  const rv=el.querySelector("#planRev"),pp=el.querySelector("#planProfit");
  const setPlan=()=>{S.plan[planKey]={rev:rv.value,profit:pp.value,cats:(S.plan[planKey]||{}).cats||{}};save();renderAll();};
  if(rv)rv.onchange=setPlan; if(pp)pp.onchange=setPlan;
  el.querySelectorAll("[data-catplan]").forEach(i=>i.onchange=()=>{
    const p=S.plan[planKey]||(S.plan[planKey]={rev:"",profit:"",cats:{}});p.cats=p.cats||{};
    if(i.value==="")delete p.cats[i.dataset.catplan];else p.cats[i.dataset.catplan]=i.value;
    save();renderAll();});
}
function paceTag(r,pace){
  if(r>=pace)return '<span class="tag ok">идёте по графику</span>';
  if(r>=pace*0.85)return '<span class="tag warn">немного отстаёте</span>';
  return '<span class="tag bad">сильно отстаёте</span>';
}
function progressBlock(label,fact,plan,pace,fmt){
  if(!plan)return `<div class="pf"><div class="top"><b>${esc(label)}</b><span class="mut">план не задан</span></div>
    <div class="bar"></div></div>`;
  const r=fact/plan;
  return `<div class="pf">
    <div class="top"><b>${esc(label)}</b>
      <span>${fmt(fact)} из ${fmt(plan)} · <b class="${r>=pace?"pos":"neg"}">${pct(r,0)}</b> ${paceTag(r,pace)}</span></div>
    <div class="bar"><i style="width:${Math.min(100,Math.max(0,r*100))}%;background:${r>=pace?"var(--ok)":r>=pace*0.85?"var(--warn)":"var(--bad)"}"></i>
      <span class="pace" style="left:${Math.min(99.5,pace*100)}%" title="ожидаемое выполнение на сегодня"></span></div>
  </div>`;
}

function retBlock(M){
  /* Одна сводная строка «Возврат»: подытоги документов с отрицательным оборотом или прибылью.
     Показывается справочно и в итоги не входит — суммы этих документов уже сидят в строках номенклатуры. */
  const r=M.ret;
  if(!r||!r.docs)return "";
  return `<div class="card" style="border-color:var(--warn);margin-bottom:14px">
    <h3>Возврат — сводная строка</h3>
    <p class="hint">Документы с отрицательным оборотом или прибылью объединены в одну строку.
      Раньше они попадали в таблицы как отдельные псевдотовары «NOART: Заказ клиента …» и завышали выручку.
      Строка справочная: сами суммы уже учтены в строках номенклатуры внутри этих документов.</p>
    <div class="tw"><table><thead><tr><th class="nos">Строка</th><th class="nos">Документов</th>
      <th class="nos">Штук</th><th class="nos">Оборот</th><th class="nos">Себестоимость</th><th class="nos">Валовая прибыль</th></tr></thead>
      <tbody><tr><td><b>Возврат</b></td><td class="num">${r.docs}</td><td class="num neg">${f0(r.qty)}</td>
        <td class="num neg">${f0(r.rev)}</td><td class="num">${f0(r.cost)}</td><td class="num neg">${f0(r.gross)}</td></tr></tbody></table></div>
    <details style="margin-top:10px"><summary class="small mut" style="cursor:pointer">Показать документы (${r.list.length})</summary>

function expandRow(t,M){
  const steps=[{name:"Выручка",v:t.rev},{name:"Себестоимость",v:-(t.cogs||0)},

  steps.push({name:"Чистая",v:t.net||0,total:true});
  const rec=recommend(t,M);
  return `<div class="grid2" style="gap:18px">
    <div>
      <div class="small mut" style="margin-bottom:6px">Нитка прибыли по товару</div>
      ${t.cogs!=null?svgWaterfall(steps,520,220):`<div class="empty">Нет себестоимости — нитка прибыли не строится</div>`}
    </div>
    <div>
      <div class="small mut" style="margin-bottom:6px">Воронка и остаток</div>

        <tr><td>Хватит на</td><td class="num">${t.daysLeft==null?"—":!isFinite(t.daysLeft)?"нет продаж в периоде":Math.round(t.daysLeft)+" дн"}</td></tr>
        <tr><td>Прайсовая цена для ВИ (PRICAT)</td><td class="num">${t.viPrice?f0(t.viPrice)+" ₽":"—"}</td></tr>
        <tr><td>НДС: 100% − цена ÷ прайс ВИ</td><td class="num ${vatCls(t.vatRatio)}">${t.vatRatio==null?"—":pct(t.vatRatio,1)}
          ${t.vatRatio==null?"":vatCls(t.vatRatio)==="neg"?'<span class="tag bad">скидка к прайсу</span>':'<span class="tag ok">по прайсу</span>'}</td></tr>
        <tr><td>Рекомендованная розничная цена</td><td class="num">${t.retail?f0(t.retail)+" ₽":"—"}</td></tr>
        <tr><td>Рекомендация по поставке</td><td>${rec}</td></tr>
      </tbody></table>
    </div></div>`;
}
const noFunnel=()=>'<span class="tag n" title="ни в одной из загруженных выгрузок нет показов, визитов и корзин">нет данных воронки в отчётах</span>';
function recommend(t,M){
  if(t.stock==null)return '<span class="tag n">нужен PRICAT с остатками</span>';
  if(t.speed<=0)return '<span class="tag n">нет продаж в периоде — поставка не требуется</span>';
  const d=t.daysLeft;
  const lowClass=(t.abcNet==="C"||t.abcNet==="L");
  if(d<S.cfg.critDays&&!lowClass)return `<span class="tag bad">пора поставлять — хватит на ${Math.round(d)} дн</span>`;
  if(d<S.cfg.warnDays&&!lowClass)return `<span class="tag warn">запланировать поставку (${Math.round(d)} дн)</span>`;
  if(d<S.cfg.warnDays)return `<span class="tag n">класс ВИ ${esc(t.abcNet)} — поставку можно отложить</span>`;
  if(d>90)return `<span class="tag n">затоварено: запас на ${Math.round(d)} дн</span>`;
  return '<span class="tag ok">остатка достаточно</span>';
}

/* ---------- Вкладка «Реклама / Воронка» ---------- */
function renderAds(M){
  const el=document.getElementById("tab-ad");
  if(!M.ok){el.innerHTML=emptyState();return;}
  const ad=M.ad;
  // Sell-out: продажи ВИ конечным покупателям за те же месяцы — из книги «Продажи по СКЮ»
  let sellOut=null,sellQty=null;
  if(S.viSell){
    const ms=monthsOf(M.ps);let r=0,q=0,found=false;const seen={};
    S.viSell.groups.filter(g=>{           // в сводной ВИ бренды повторяются в разрезе каналов —
      if(!g.months.length)return false;   // берём только первый блок с помесячной разбивкой
      if(seen[g.name])return false; seen[g.name]=1; return true;
    }).forEach(g=>g.months.forEach(mm=>{
      ms.forEach(x=>{if(mm.m===x.m){
        const kr=Object.keys(mm.vals).find(k=>/выручка/i.test(k)&&k.endsWith("|"+x.y));
        const kq=Object.keys(mm.vals).find(k=>/количество/i.test(k)&&k.endsWith("|"+x.y));
        if(kr){r+=mm.vals[kr];found=true;} if(kq)q+=mm.vals[kq];
      }});}));
    if(found){sellOut=r;sellQty=q;}
  }
  /* ВАЖНО про базы цен: sell-in (наши отгрузки на ВИ) идёт по закупочной цене — это наша отпускная,
     а sell-out (продажи ВИ конечным покупателям) — по РРЦ. Складывать и делить их напрямую нельзя.
     Приводим sell-out к закупочной базе через коэффициент РРЦ/закупочная из PRICAT и показываем обе цифры. */
  const k=M.rrcK?M.rrcK.v:null;
  const sellOutBase=(sellOut!=null&&k)?sellOut/k:null;
  const sellThrough=(sellQty&&M.qty)?sellQty/M.qty:null;
  const drrSellIn=M.drr;
  const drrSellOutRRC=(sellOut&&ad.v)?ad.v/sellOut:null;

  const steps=[];
  steps.push({l:"Продажи ГТВ РУС → ВИ (sell-in)",v:M.revenue,base:M.revenue,
    tag:"закупочная цена",sub:f0(M.qty)+" шт · наша отпускная цена без НДС, отчёт 1С"});
  if(sellOut!=null){
    steps.push({l:"Продажи ВИ конечным покупателям (sell-out)",v:sellOut,base:sellOutBase,
      tag:"РРЦ", sub:f0(sellQty)+" шт · выручка без НДС в розничных ценах, выгрузка ВИ"
        +(sellOutBase!=null?" · в закупочных ценах это "+money(sellOutBase):"")});
  }
  steps.push({l:"Расход на рекламу",v:ad.v||0,base:ad.v||0,tag:"с НДС",
    sub:ad.v==null?esc(ad.reason||""):"маркетинговый план"});

  const byGroup={};
  (ad.detail||[]).forEach(d=>{byGroup[d.group]=(byGroup[d.group]||0)+d.spend;});

  el.innerHTML=`
  <div class="card">
    <h3>Воронка каталога · ${esc(M.label)}</h3>
    <p class="hint">Ни в одной выгрузке нет показов, визитов в карточку и добавлений в корзину — это выгрузки B2B-поставки,
      а не кабинета маркетплейса. Поэтому воронка построена по доступному разрезу: отгрузка на ВИ → продажа конечным покупателям → стоимость рекламы.</p>
    <div style="display:flex;flex-direction:column;gap:10px;max-width:860px">
      ${steps.map((st,i)=>{
        const b0=steps[0].base||1;
        const w=st.base!=null?Math.max(6,Math.min(100,st.base/b0*100)):100;
        return `<div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;gap:10px">
          <span>${esc(st.l)} <span class="tag n">${esc(st.tag)}</span></span>
          <span class="num">${money(st.v)}</span></div>
        <div class="bar" style="height:26px"><i style="width:${w}%;background:${i===steps.length-1?"var(--warn)":"var(--acc)"};opacity:${1-i*0.18}"></i></div>
        <div class="xs mut3" style="margin-top:3px">${st.sub}</div></div>`;}).join("")}
    </div>
    <p class="hint" style="margin-top:12px">Длина полос приведена к одной базе — закупочным ценам. Суммы подписаны в своей исходной базе:
      sell-in в закупочных, sell-out в РРЦ. ${M.rrcK
        ? `Коэффициент перевода РРЦ → закупочная — <b>${f2(M.rrcK.v)}</b> (${esc(M.rrcK.src)}${M.rrcK.nn?", "+M.rrcK.nn+" SKU":""}); задать своё значение можно на вкладке «Данные».`

/* ================================================================================
   БЛОК 8b. ВКЛАДКА «МАТРИЦА ВИ»
   Классы A / B / C / D / L / M / X приходят из колонки «Матрица» файла «Матрица товаров».
   Квартал в самом файле не указан нигде, поэтому он либо угадывается из имени файла,
   либо задаётся вручную — без этого сравнение кварталов было бы выдумкой.
   ================================================================================ */
const CLS_ORDER=["X","A","B","C","D","L","M"];
const CLS_COL={A:"var(--acc)",B:"var(--acc2)",C:"var(--line2)",D:"#7a6bd6",L:"var(--info)",M:"#c98bd6",X:"var(--ok)"};
const clsList=maps=>{
  const set=new Set();maps.forEach(m=>Object.values(m||{}).forEach(v=>{if(v.cls)set.add(v.cls);}));
  return [...CLS_ORDER.filter(c=>set.has(c)),...[...set].filter(c=>!CLS_ORDER.includes(c)).sort()];
};
const countByCls=map=>{const c={};Object.values(map||{}).forEach(v=>{if(v.cls)c[v.cls]=(c[v.cls]||0)+1;});return c;};

/* Сгруппированная столбчатая диаграмма: два квартала рядом по каждому классу. */
function svgGrouped(cats,series,w,h){
  w=w||780;h=h||260;const pad={l:10,r:10,t:22,b:46};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const gap=iw/cats.length, bw=gap*0.66/series.length;
  if(series.some(s=>s.lab&&s.lab.some(x=>String(x).includes("\n"))))pad.t+=12;
  const mx=Math.max(1,...series.flatMap(s=>s.v));
  let g="";
  cats.forEach((c,i)=>{
    series.forEach((s,k)=>{
      const v=s.v[i]||0,bh=Math.max(1,v/mx*ih);
      const x=pad.l+i*gap+(gap-bw*series.length)/2+k*bw, y=pad.t+ih-bh;
      g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${s.c}" opacity="${k?.6:.95}"/>`;
      const lab=s.lab?s.lab[i]:(v||"");
      // подпись может быть двухстрочной: значение сверху, процент выполнения под ним
      String(lab).split("\n").forEach((ln,li)=>{
        g+=`<text x="${(x+(bw-3)/2).toFixed(1)}" y="${(y-6-(String(lab).split("\n").length-1-li)*12).toFixed(1)}"
          text-anchor="middle" font-size="${li?9.5:10.5}" fill="${li?"var(--tx2)":"var(--tx)"}">${esc(ln)}</text>`;});
    });
    g+=`<text x="${(pad.l+i*gap+gap/2).toFixed(1)}" y="${(pad.t+ih+17).toFixed(1)}" text-anchor="middle" font-size="12" fill="var(--tx2)">${esc(c)}</text>`;
  });
  g+=`<line x1="${pad.l}" y1="${pad.t+ih}" x2="${w-pad.r}" y2="${pad.t+ih}" stroke="var(--line2)"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${g}</svg>`;
}

function renderMatrix(M){
  const el=document.getElementById("tab-mx");
  const sets=Object.values(S.matrixSets||{});
  if(!sets.length){
    el.innerHTML=`<div class="card"><h3>Матрица товаров ВсеИнструменты.ру</h3>
      <div class="empty">Не загружен ни один файл матрицы. Нужна книга с листом «Матрица товаров»
      (колонки «Артикул поставщика» и «Матрица») — например, «Матрица_товаров_1_квартал.xlsx».<br>
      Чтобы сравнить кварталы, загрузите два таких файла: за 1-й и за 2-й квартал.</div></div>`;
    return;
  }
  const st=tstate("mx","art");
  const dated=sets.filter(s=>s.quarter).sort((a,b)=>a.quarter<b.quarter?-1:1);
  const qA=st.qA&&S.matrixSets[st.qA]?st.qA:(dated[0]||sets[0]).id;
  const qB=st.qB&&S.matrixSets[st.qB]?st.qB:(dated[1]||sets[1]||sets[0]).id;
  const A=S.matrixSets[qA],B=S.matrixSets[qB];
  const same=qA===qB;
  const cats=clsList([A.map,B.map]);
  const cA=countByCls(A.map),cB=countByCls(B.map);
  /* Проверяем, не один ли это список, загруженный дважды: иначе «сравнение» показывает
     одинаковые столбцы и выглядит как будто переключение кварталов не работает. */
  const identical=!same&&sameMap(A.map,B.map);
  /* Класс C обычно на порядок больше остальных и сплющивает график, поэтому по умолчанию
     самый крупный класс из диаграммы убираем — цифры при этом остаются в таблице. */
  const domin=cats.slice().sort((x,y)=>(cB[y]||0)-(cB[x]||0))[0];
  const second=cats.slice().sort((x,y)=>(cB[y]||0)-(cB[x]||0))[1];
  if(st.hide===undefined)st.hide=(domin&&second&&(cB[domin]||0)>5*(cB[second]||0))?[domin]:[];
  const shown=cats.filter(c=>!st.hide.includes(c));
  const labA=A.quarter?qLabel(A.quarter):A.label, labB=B.quarter?qLabel(B.quarter):B.label;

  /* Переходы между классами: что изменилось от одного квартала к другому. */
  const moves=[];let added=0,removed=0,changed=0,stayed=0;
  const arts=new Set([...Object.keys(A.map),...Object.keys(B.map)]);
  arts.forEach(a=>{
    const x=A.map[a],y=B.map[a];
    const ca=x&&x.cls?x.cls:null, cb=y&&y.cls?y.cls:null;
    if(ca===cb){if(ca)stayed++;return;}
    if(!ca)added++; else if(!cb)removed++; else changed++;
    moves.push({art:a,name:(y&&y.name)||(x&&x.name)||"",from:ca,to:cb,
      kind:!ca?"новый":!cb?"выбыл":"переведён"});
  });

  // товары квартала с продажами: даём срез по выручке и прибыли на класс
  const bySales={};
  (M.items||[]).forEach(t=>{const m=B.map[t.art];const c=m&&m.cls;if(!c)return;
    const z=bySales[c]||(bySales[c]={cls:c,sku:0,qty:0,rev:0,net:0});
    z.sku++;z.qty+=t.qty;z.rev+=t.rev;if(t.net!=null)z.net+=t.net;});

  // список артикулов выбранного квартала
  const showId=st.showQ&&S.matrixSets[st.showQ]?st.showQ:qB;
  const SH=S.matrixSets[showId];
  const shList=Object.entries(SH.map).filter(([a,v])=>v.cls)
    .map(([a,v])=>({art:a,name:v.name,cls:v.cls,
      other:(showId===qA?B:A).map[a]?((showId===qA?B:A).map[a].cls||null):null}))
    .filter(r=>!st.mxCls||r.cls===st.mxCls)
    .filter(r=>{const q=(st.mxQ||"").trim().toUpperCase();
      return !q||r.art.toUpperCase().includes(q)||String(r.name).toUpperCase().includes(q);})
    .sort((a,b)=>CLS_ORDER.indexOf(a.cls)-CLS_ORDER.indexOf(b.cls)||a.art.localeCompare(b.art));

  el.innerHTML=`
  <div class="card">
    <h3>Наборы матрицы</h3>
    <p class="hint">Период внутри файла матрицы не передаётся — ни колонкой, ни листом. Квартал определяется по имени файла,

/* Полное совпадение двух наборов матрицы — по составу артикулов и присвоенным классам. */
function sameMap(a,b){
  const ka=Object.keys(a),kb=Object.keys(b);
  if(ka.length!==kb.length)return false;
  for(const k of ka){if(!b[k]||b[k].cls!==a[k].cls)return false;}
  return true;
}
function qLabel(q){const[y,qq]=String(q).split("-Q");return qq+"-й квартал "+y;}

      <th class="nos">Артикул</th><th class="nos">Наименование</th><th class="nos">₽/шт</th><th class="nos"></th></tr></thead>
      <tbody>${Object.keys(S.manualCost).sort().map(a=>{
        const nm=(S.pricat[a]&&S.pricat[a].name)||(S.costFile[a]&&S.costFile[a].name)||
          ((M.items||[]).find(t=>t.art===a)||{}).name||"";
        return `<tr><td><span class="art">${esc(a)}</span></td><td class="nm">${esc(String(nm).slice(0,70))}</td>
        <td><input class="costin man" type="number" step="0.01" data-costart="${esc(a)}" value="${S.manualCost[a]}"></td>
        <td><span class="x" style="cursor:pointer;color:var(--tx3)" data-delcost="${esc(a)}">✕</span></td></tr>`;}).join("")}
      </tbody></table></div>`:`<div class="empty">Ручных значений пока нет — вся себестоимость берётся из отчётов</div>`}
  </div>

  <div class="card">
    <h3>Сброс</h3>
    <p class="hint">Планы, ручная себестоимость и срезы хранятся отдельно от данных отчётов — можно очистить только отчёты.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="clrData">Удалить все отчёты</button>
      <button class="btn" id="clrCost">Удалить ручную себестоимость</button>
      <button class="btn" id="clrSnap">Удалить срезы</button>
      <button class="btn" id="clrAll">Очистить всё</button>
    </div>
  </div>`;

  const drop=el.querySelector("#drop");
  drop.onclick=()=>document.getElementById("fileIn").click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");};
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");handleFiles(e.dataTransfer.files);};
  el.querySelectorAll("[data-delper]").forEach(b=>b.onclick=()=>{
    delete S.periods[b.dataset.delper];
    if(S.cur===b.dataset.delper)S.cur=null;finishLoad();});
  el.querySelectorAll("[data-delcost]").forEach(b=>b.onclick=()=>{
    delete S.manualCost[b.dataset.delcost];save();renderAll();});
  const bind=(id,fn)=>{const x=el.querySelector("#"+id);if(x)x.onchange=()=>{fn(x);save();renderAll();};};
  bind("cfgK",x=>S.cfg.rrcK=x.value.trim()===""?null:Math.max(0.01,+x.value||1));
  bind("cfgAdBase",x=>S.cfg.adBase=x.value);
  bind("cfgVat",x=>S.cfg.vatCost=x.checked);
  bind("cfgMkt",x=>S.cfg.skipMktBonus=x.checked);
  bind("cfgTax",x=>S.cfg.taxRate=Math.max(0,+x.value||0));
  bind("cfgLo",x=>S.cfg.drrLo=+x.value||7);
  bind("cfgHi",x=>S.cfg.drrHi=+x.value||15);
  el.querySelector("#clrData").onclick=()=>{if(confirm("Удалить все загруженные отчёты? Планы и ручная себестоимость сохранятся."))
    {S.periods={};S.pricat={};S.costFile={};S.mkt=null;S.bonus={};S.viSell=null;S.viStock=[];S.matrix={};S.cur=null;save();renderAll();}};
  el.querySelector("#clrCost").onclick=()=>{if(confirm("Удалить всю введённую вручную себестоимость?")){S.manualCost={};save();renderAll();}};
  el.querySelector("#clrSnap").onclick=()=>{if(confirm("Удалить историю срезов?")){S.snaps=[];save();renderAll();}};
  el.querySelector("#clrAll").onclick=()=>{if(confirm("Очистить всё, включая планы и настройки?"))
    {Object.values(LS).forEach(k=>localStorage.removeItem(k));location.reload();}};
}
const statusTag=(ok,txt)=>ok?`<span class="tag ok">загружено</span> <span class="xs mut3">${esc(txt)}</span>`
  :'<span class="tag n">нет</span>';

function emptyState(){
  return `<div class="card"><h3>Данные не загружены</h3>
    <p class="hint">Дашборд ничего не показывает, пока нет отчётов — нули вместо реальных цифр вводили бы в заблуждение.</p>
    <div class="drop" onclick="document.getElementById('fileIn').click()">
      Загрузить отчёты<br><span class="small mut3">отчёты 1С по месяцам · себестоимость · PRICAT с остатками · маркетинговый план · бонусы · книга ВИ</span></div>
  </div>`;
}

/* ================================================================================
   БЛОК 10. ОЧИСТКА И ПЕРЕНОС СОСТОЯНИЯ
   ================================================================================ */
function clearDialog(){
  const pk=Object.keys(S.periods).sort();
  modal(`<h3>Что очистить?</h3>
    <p class="hint">Действие необратимо. Планы, ручная себестоимость и срезы хранятся отдельно от отчётов,
      поэтому их можно оставить или удалить независимо.</p>

    ${pk.length?`<div style="margin-bottom:16px">
      <div class="small mut" style="margin-bottom:7px">Отдельный месяц</div>
      <div class="chips">${pk.map(k=>`<span class="chip" data-clrmon="${esc(k)}">
        Очистить ${esc(S.periods[k].label.toLowerCase())} · ${short(sumRev(S.periods[k]))}</span>`).join("")}</div>
    </div>`:`<div class="empty" style="margin-bottom:16px">Отчёты о продажах не загружены</div>`}

    <div class="small mut" style="margin-bottom:7px">Целиком</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn" data-clr="periods">Очистить все периоды продаж<span class="mut small"> — ${pk.length} ${plur(pk.length,"месяц","месяца","месяцев")}, ${short(pk.reduce((a,k)=>a+sumRev(S.periods[k]),0))}</span></button>
      <button class="btn" data-clr="refs">Очистить справочники<span class="mut small"> — себестоимость, PRICAT, матрица, маркетинговый план, бонусы, план оборота</span></button>
      <button class="btn" data-clr="snaps">Очистить срезы<span class="mut small"> — ${S.snaps.length} ${plur(S.snaps.length,"срез","среза","срезов")}</span></button>
      <button class="btn" data-clr="manual">Очистить ручную себестоимость и планы<span class="mut small"> — ${Object.keys(S.manualCost).length} значений</span></button>
      <button class="btn" data-clr="all" style="border-color:var(--bad);color:var(--bad)">Очистить всё, включая настройки</button>
      <button class="btn ghost" data-clr="cancel">Отмена</button>
    </div>`,
  host=>{
    host.querySelectorAll("[data-clrmon]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.clrmon,lab=S.periods[k].label;
      delete S.periods[k];
      if(S.cur===k)S.cur=null;
      closeModal();finishLoad();toast("Период «"+esc(lab)+"» удалён","ok");});
    host.querySelectorAll("[data-clr]").forEach(b=>b.onclick=()=>{
      const a=b.dataset.clr;
      if(a==="cancel")return closeModal();
      if(!confirm("Подтвердите: "+b.textContent.split("—")[0].trim()))return;
      if(a==="periods"){S.periods={};S.cur=null;}
      if(a==="refs"){S.pricat={};S.costFile={};S.matrixSets={};S.matrix={};S.mkt=null;
        S.bonus={};S.viSell=null;S.viStock=[];S.planFile=null;S.cfg.matrixActive=null;}
      if(a==="snaps")S.snaps=[];
      if(a==="manual"){S.manualCost={};S.plan={};}
      if(a==="all"){Object.values(LS).forEach(k=>localStorage.removeItem(k));location.reload();return;}
      closeModal();finishLoad();});
  });
}

function stateDialog(){
  const pk=Object.keys(S.periods).length;
  let size="—";
  try{size=(JSON.stringify(packState()).length/1048576).toFixed(2)+" МБ";}catch(e){}
  modal(`<h3>Перенос состояния</h3>
    <p class="hint">Дашборд хранит данные в памяти самого браузера (localStorage). Это хранилище привязано
      к конкретному браузеру на конкретном компьютере: другой браузер, другой профиль или режим инкогнито
      увидят пустой дашборд, даже если открыть тот же файл. Сервера у дашборда нет, поэтому единственный
      способ перенести данные — файл состояния.</p>
    <div class="tw" style="margin-bottom:16px"><table><tbody>
      <tr><td>Периодов продаж</td><td class="num">${pk}</td></tr>
      <tr><td>Сохранённых срезов</td><td class="num">${S.snaps.length}</td></tr>
      <tr><td>Ручная себестоимость</td><td class="num">${Object.keys(S.manualCost).length} значений</td></tr>
      <tr><td>Объём состояния</td><td class="num">${size}</td></tr>
      <tr><td>Последнее сохранение в браузер</td><td>${LAST_SAVE_OK
        ?'<span class="tag ok">успешно</span>':'<span class="tag bad">не удалось</span>'}</td></tr>
    </tbody></table></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn primary" data-st="export">Выгрузить в файл</button>
      <button class="btn" data-st="import">Загрузить из файла<span class="mut small"> — заменит текущие данные</span></button>
      <button class="btn ghost" data-st="cancel">Закрыть</button>
    </div>`,
  host=>{
    host.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{
      const a=b.dataset.st;closeModal();
      if(a==="export")exportState();
      if(a==="import")document.getElementById("stateIn").click();});
  });
}

/* ================================================================================
   БЛОК 9. ГЛАВНЫЙ РЕНДЕР И ИНИЦИАЛИЗАЦИЯ
   ================================================================================ */
let CUR_M=null;
function renderAll(){
  const M=compute();CUR_M=M;
  renderPeriodSel();
  renderKpis(M);
  renderOverview(M);renderPlanFact(M);renderUnit(M);renderProducts(M);renderAds(M);renderStock(M);renderMatrix(M);renderData(M);
  const cnts={pr:M.ok?M.items.length:0,st:M.ok?M.crit.length+M.warnSt.length:0,ue:M.ok?M.cov.cntNone:0,
    mx:Object.keys(S.matrixSets||{}).length};
  document.querySelectorAll("#tabs button").forEach(b=>{
    const c=cnts[b.dataset.t];
    b.innerHTML=b.textContent.replace(/\s*\d+$/,"").trim();
    if(c)b.innerHTML+=`<span class="cnt">${c}</span>`;
  });
  document.querySelectorAll("main .tab").forEach(s=>s.classList.remove("on"));
  const act=document.getElementById("tab-"+S.ui.tab);if(act)act.classList.add("on");
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.ui.tab));
  bindTables(document);bindTools(document);
  document.querySelectorAll("[data-cnt]").forEach(e=>{
    const id=e.dataset.cnt;const src=id==="ue"?(M.items||[]).filter(t=>t.uc!=null):id==="st"?(M.items||[]).filter(t=>t.stock!=null):(M.items||[]);
    e.textContent="Показано: "+filterRows(src,id).length+" из "+src.length;});
  document.getElementById("btnSnap").disabled=!M.ok;
  renderStorageWarn();
}
/* Постоянная плашка о состоянии хранилища: если браузер не сохраняет данные,
   человек должен узнать об этом сразу, а не после закрытия вкладки. */
function renderStorageWarn(){
  const el=document.getElementById("storageWarn");
  if(STORAGE_OK&&LAST_SAVE_OK){el.innerHTML="";return;}
  el.innerHTML=`<div style="margin:0 20px;margin-top:14px" class="card" style="border-color:var(--bad)">
    <div class="ins bad" style="margin:0"><span class="ic">⚠</span><div>
      ${!STORAGE_OK
        ? `<b>Браузер запрещает этой странице сохранять данные</b> (${esc(STORAGE_ERR)}).
           Всё, что вы загрузите, исчезнет при закрытии вкладки. Обычно так ведёт себя режим инкогнито
           или Safari при открытии файла с диска. Откройте файл в Chrome или Firefox в обычном окне,
           либо пользуйтесь кнопкой «Состояние → Выгрузить в файл» перед закрытием.`
        : `<b>Последнее сохранение не прошло полностью.</b> Отчёты могли не поместиться в память браузера.
           Удалите лишние периоды кнопкой «Очистить» или выгрузите состояние в файл кнопкой «Состояние».`}
    </div></div></div>`;
}
function renderPeriodSel(){
  const sel=document.getElementById("periodSel");
  const keys=Object.keys(S.periods).sort();
  if(!keys.length){sel.innerHTML='<option>Нет данных</option>';sel.disabled=true;return;}
  sel.disabled=false;
  sel.innerHTML=keys.map(k=>`<option value="${k}"${S.cur===k?" selected":""}>${esc(S.periods[k].label)}</option>`).join("")
    +`<option value="ALL"${S.cur==="ALL"?" selected":""}>— Все периоды (${keys.length}) —</option>`;
}

function init(){
  load();
  pickActiveMatrix();   // активный набор матрицы восстанавливается из matrixSets, отдельно он не хранится
  document.getElementById("btnUp").onclick=()=>document.getElementById("fileIn").click();
  document.getElementById("fileIn").onchange=e=>{handleFiles(e.target.files);e.target.value="";};
  document.getElementById("periodSel").onchange=e=>{S.cur=e.target.value;save();renderAll();};
  document.getElementById("tabs").onclick=e=>{
    const b=e.target.closest("button");if(!b)return;S.ui.tab=b.dataset.t;save();renderAll();
    window.scrollTo({top:0,behavior:"smooth"});};
  document.getElementById("btnClear").onclick=clearDialog;
  document.getElementById("btnState").onclick=stateDialog;
  document.getElementById("stateIn").onchange=e=>{
    if(e.target.files[0])importState(e.target.files[0]);e.target.value="";};
  document.getElementById("btnSnap").onclick=()=>{
    const M=CUR_M;if(!M||!M.ok)return;
    S.snaps.push({label:M.label,ts:new Date().toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}),
      revenue:M.revenue,net:M.net,margin:M.margin,drr:M.drr,cogs:M.cogs,ad:M.adV});
    save();renderAll();toast("Срез сохранён. Точек в тренде: <b>"+S.snaps.length+"</b>","ok");};
  // глобальная защита от «молчаливых» падений
  window.addEventListener("error",e=>{
    console.error(e.error||e.message);
    toast("Внутренняя ошибка: "+esc(String(e.message||"")).slice(0,180)+"<br><span class='xs mut'>Данные не потеряны. Подробности — в консоли браузера (F12).</span>","err",10000);});
  ["dragover","drop"].forEach(k=>document.addEventListener(k,e=>e.preventDefault()));
  document.addEventListener("drop",e=>{if(e.dataTransfer&&e.dataTransfer.files.length)handleFiles(e.dataTransfer.files);});
  renderAll();
  if(!Object.keys(S.periods).length){S.ui.tab="dt";renderAll();}
}
if(typeof XLSX==="undefined"){
  document.body.insertAdjacentHTML("afterbegin",
    '<div style="padding:20px;background:#3a1d1d;color:#ffb4b0">Не удалось загрузить SheetJS с cdnjs. Проверьте соединение — без библиотеки чтение .xlsx невозможно.</div>');
}else init();
</script>
</body>
</html>
